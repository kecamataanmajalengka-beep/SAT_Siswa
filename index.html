<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Panel Siswa - KOREK API Majalengka</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script>
tailwind.config={theme:{extend:{colors:{primary:'#6366f1',secondary:'#f472b6',accent:'#22d3ee',success:'#4ade80',warning:'#fbbf24',danger:'#f87171',dark:'#1e1b4b',card:'#312e81',light:'#f5f3ff'},fontFamily:{display:['Fredoka One','cursive'],body:['Nunito','sans-serif']}}}}
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none}
html,body{width:100%;overflow-x:hidden;font-family:'Nunito',sans-serif}
body{background:linear-gradient(135deg,#1e1b4b 0%,#312e81 50%,#4c1d95 100%);color:#f5f3ff;min-height:100vh;min-height:100dvh}

@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}
@keyframes wiggle{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes sparkle{0%,100%{opacity:0;transform:scale(0)}50%{opacity:1;transform:scale(1)}}
@keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes pop{0%{transform:scale(0)}80%{transform:scale(1.1)}100%{transform:scale(1)}}
@keyframes confetti{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(-100vh) rotate(720deg);opacity:0}}
@keyframes heartbeat{0%,100%{transform:scale(1)}25%{transform:scale(1.1)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes blink{0%,45%,55%,100%{transform:scaleY(1)}50%{transform:scaleY(0.1)}}
@keyframes shimmer{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
@keyframes urgentPulse{0%,100%{box-shadow:0 0 0 0 rgba(248,113,113,0.7)}50%{box-shadow:0 0 0 12px rgba(248,113,113,0)}}

.float{animation:float 3s ease-in-out infinite}
.bounce{animation:bounce 2s ease-in-out infinite}
.wiggle{animation:wiggle 1s ease-in-out infinite}
.pulse{animation:pulse 2s ease-in-out infinite}
.pop{animation:pop 0.4s cubic-bezier(0.68,-0.55,0.265,1.55)}
.slide-up{animation:slideUp 0.5s ease-out forwards}
.fade-in{animation:fadeIn 0.3s ease-out}

.floating-shapes{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.shape{position:absolute;border-radius:50%;opacity:0.12}
.shape-1{width:300px;height:300px;background:linear-gradient(135deg,#6366f1,#a855f7);top:-100px;right:-100px;animation:float 8s ease-in-out infinite}
.shape-2{width:200px;height:200px;background:linear-gradient(135deg,#22d3ee,#06b6d4);bottom:10%;left:-50px;animation:float 10s ease-in-out infinite reverse}
.shape-3{width:150px;height:150px;background:linear-gradient(135deg,#f472b6,#ec4899);top:40%;right:-30px;animation:bounce 6s ease-in-out infinite}
.shape-4{width:100px;height:100px;background:linear-gradient(135deg,#4ade80,#22c55e);bottom:20%;right:10%;animation:wiggle 5s ease-in-out infinite}

.stars{position:fixed;inset:0;pointer-events:none;z-index:1}
.star{position:absolute;width:4px;height:4px;background:#fbbf24;border-radius:50%;animation:sparkle 2s ease-in-out infinite}
.star:nth-child(odd){animation-delay:0.5s}

.glass{background:rgba(49,46,129,0.75);backdrop-filter:blur(20px);border:1px solid rgba(99,102,241,0.3);border-radius:24px;box-shadow:0 8px 32px rgba(0,0,0,0.3)}

.btn-primary{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:white;font-weight:700;padding:14px 28px;border-radius:16px;border:none;cursor:pointer;font-size:16px;font-family:'Nunito',sans-serif;display:flex;align-items:center;justify-content:center;gap:8px;transition:all 0.3s;box-shadow:0 8px 25px rgba(99,102,241,0.4);position:relative;overflow:hidden}
.btn-primary::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,0.2),transparent);opacity:0;transition:opacity 0.3s}
.btn-primary:hover::before{opacity:1}
.btn-primary:active{transform:scale(0.97)}
.btn-primary:disabled{opacity:0.5;cursor:not-allowed;transform:none}
.btn-primary:hover{box-shadow:0 12px 35px rgba(99,102,241,0.5)}

.btn-secondary{background:rgba(99,102,241,0.2);border:2px solid rgba(99,102,241,0.5);color:#f5f3ff;padding:12px 24px;border-radius:16px;cursor:pointer;font-size:14px;font-family:'Nunito',sans-serif;transition:all 0.3s}
.btn-secondary:hover{background:rgba(99,102,241,0.3);border-color:#6366f1}

.input-field{background:rgba(30,27,75,0.8);border:2px solid rgba(99,102,241,0.3);color:#f5f3ff;padding:14px 18px;border-radius:14px;width:100%;font-size:16px;font-family:'Nunito',sans-serif;transition:all 0.3s}
.input-field:focus{outline:none;border-color:#6366f1;box-shadow:0 0 20px rgba(99,102,241,0.3)}
.input-field::placeholder{color:#a5b4fc}
.input-field option{background:#312e81;color:#f5f3ff;padding:10px}

.step-container{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:20px}
.step-item{display:flex;flex-direction:column;align-items:center;gap:4px}
.step-circle{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;transition:all 0.4s;position:relative}
.step-circle.inactive{background:rgba(99,102,241,0.2);color:#a5b4fc}
.step-circle.active{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:white;box-shadow:0 0 25px rgba(99,102,241,0.5);animation:pulse 2s ease-in-out infinite}
.step-circle.done{background:linear-gradient(135deg,#4ade80,#22c55e);color:white}
.step-circle.done::after{content:'';position:absolute;inset:-3px;border-radius:50%;border:2px solid #4ade80;animation:pulse 1.5s ease-in-out infinite}
.step-line{width:30px;height:3px;background:rgba(99,102,241,0.3);border-radius:2px;transition:all 0.4s}
.step-line.done{background:linear-gradient(90deg,#4ade80,#22c55e)}
.step-label{font-size:9px;font-weight:600;color:#a5b4fc;transition:color 0.3s;text-align:center;max-width:50px}
.step-label.active{color:#6366f1}
.step-label.done{color:#4ade80}

.mascot{width:100px;height:100px;margin:0 auto;position:relative}
.mascot-body{width:80px;height:80px;background:linear-gradient(135deg,#fbbf24,#f59e0b);border-radius:50%;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);box-shadow:0 10px 30px rgba(251,191,36,0.4)}
.mascot-face{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);width:60px}
.mascot-eye{width:10px;height:14px;background:#1e1b4b;border-radius:50%;position:absolute;top:0;animation:blink 4s ease-in-out infinite}
.mascot-eye.left{left:10px}
.mascot-eye.right{right:10px}
.mascot-mouth{width:24px;height:12px;border-bottom:3px solid #1e1b4b;border-radius:0 0 24px 24px;position:absolute;top:20px;left:50%;transform:translateX(-50%)}
.mascot-cheek{width:12px;height:8px;background:#f472b6;opacity:0.6;border-radius:50%;position:absolute;top:12px}
.mascot-cheek.left{left:2px}
.mascot-cheek.right{right:2px}
.mascot.happy .mascot-body{animation:bounce 1s ease-in-out infinite}
.mascot.sad .mascot-mouth{border-radius:24px 24px 0 0;border-bottom:none;border-top:3px solid #1e1b4b}
.mascot.celebrate .mascot-body{animation:wiggle 0.5s ease-in-out infinite}

.select-card{padding:16px;border-radius:16px;cursor:pointer;transition:all 0.3s;border:2px solid rgba(99,102,241,0.2);background:rgba(49,46,129,0.4);text-align:center;position:relative;overflow:hidden}
.select-card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,0.05),transparent);opacity:0;transition:opacity 0.3s}
.select-card:hover{transform:translateY(-2px);border-color:rgba(99,102,241,0.5);box-shadow:0 8px 20px rgba(99,102,241,0.2)}
.select-card:hover::before{opacity:1}
.select-card:active{transform:scale(0.98)}
.select-card.selected{border-color:#4ade80;background:rgba(74,222,128,0.1);box-shadow:0 0 20px rgba(74,222,128,0.2)}
.select-card.selected .card-icon{animation:bounce 0.6s ease-in-out}

.mapel-card{padding:12px;border-radius:14px;cursor:pointer;transition:all 0.3s;border:2px solid rgba(99,102,241,0.2);background:rgba(49,46,129,0.4);display:flex;align-items:center;gap:10px;position:relative;overflow:hidden}
.mapel-card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,0.05),transparent);opacity:0;transition:opacity 0.3s}
.mapel-card:hover{transform:translateY(-2px);border-color:rgba(99,102,241,0.4)}
.mapel-card:hover::before{opacity:1}
.mapel-card:active{transform:scale(0.98)}
.mapel-card.selected{border-color:#4ade80;background:rgba(74,222,128,0.1)}
.mapel-card.selected .mapel-icon{animation:heartbeat 0.8s ease-in-out}
.mapel-card.locked{opacity:0.4;pointer-events:none}
.mapel-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}

.token-input{letter-spacing:6px;font-size:22px;font-weight:800;text-align:center;font-family:'Fredoka One',cursive;padding:14px;text-transform:uppercase}

.progress-container{height:8px;background:rgba(99,102,241,0.2);border-radius:4px;overflow:hidden;position:relative}
.progress-bar{height:100%;background:linear-gradient(90deg,#6366f1,#8b5cf6,#a855f7);border-radius:4px;transition:width 0.5s;position:relative}
.progress-bar::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.3),transparent);animation:shimmer 2s infinite}

.question-card{background:rgba(49,46,129,0.5);border-radius:18px;border:2px solid rgba(99,102,241,0.2);padding:18px;margin-bottom:14px;position:relative;overflow:hidden;transition:all 0.3s}
.question-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:linear-gradient(180deg,#6366f1,#a855f7);border-radius:4px 0 0 4px}
.question-card:hover{border-color:rgba(99,102,241,0.3)}

.question-number{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;background:linear-gradient(135deg,#6366f1,#8b5cf6);border-radius:8px;font-weight:800;font-size:13px;margin-right:8px}

.option-item{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:12px;cursor:pointer;transition:all 0.2s;border:2px solid rgba(99,102,241,0.15);background:rgba(30,27,75,0.4);position:relative}
.option-item:hover{background:rgba(99,102,241,0.1);border-color:rgba(99,102,241,0.3)}
.option-item:active{transform:scale(0.99)}
.option-item.selected{background:rgba(74,222,128,0.1);border-color:#4ade80}
.option-item.selected .option-letter{background:linear-gradient(135deg,#4ade80,#22c55e);color:white}
.option-letter{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;background:rgba(99,102,241,0.3);flex-shrink:0;transition:all 0.3s}
.option-item:hover .option-letter{background:rgba(99,102,241,0.5)}

.result-card{background:rgba(49,46,129,0.7);border-radius:24px;border:2px solid rgba(99,102,241,0.3);padding:24px;text-align:center}
.score-display{font-family:'Fredoka One',cursive;font-size:72px;line-height:1;background:linear-gradient(135deg,#fbbf24,#f59e0b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.score-display.success{background:linear-gradient(135deg,#4ade80,#22c55e);-webkit-background-clip:text;background-clip:text}
.score-display.fail{background:linear-gradient(135deg,#f87171,#ef4444);-webkit-background-clip:text;background-clip:text}

.confetti-container{position:fixed;inset:0;pointer-events:none;z-index:100}
.confetti{position:absolute;width:10px;height:10px;animation:confetti 3s ease-out forwards}
.confetti:nth-child(odd){border-radius:50%}
.confetti:nth-child(3n){width:8px;height:16px;border-radius:4px}

.toast{position:fixed;top:16px;left:16px;right:16px;z-index:1000;padding:14px 18px;border-radius:14px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:10px;animation:slideUp 0.3s ease;max-width:400px;margin:0 auto}
.toast-success{background:linear-gradient(135deg,#059669,#047857);border:2px solid #4ade80}
.toast-error{background:linear-gradient(135deg,#dc2626,#b91c1c);border:2px solid #f87171}
.toast-info{background:linear-gradient(135deg,#0891b2,#0e7490);border:2px solid #22d3ee}

.badge{display:inline-flex;align-items:center;gap:4px;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700}
.badge-primary{background:rgba(99,102,241,0.3);color:#a5b4fc}
.badge-success{background:rgba(74,222,128,0.3);color:#4ade80}
.badge-warning{background:rgba(251,191,36,0.3);color:#fbbf24}
.badge-danger{background:rgba(248,113,113,0.3);color:#f87171}
.badge-info{background:rgba(34,211,238,0.3);color:#22d3ee}

.info-box{padding:14px;border-radius:12px;display:flex;align-items:center;gap:12px}
.info-box.success{background:rgba(74,222,128,0.1);border:2px solid rgba(74,222,128,0.3)}
.info-box.warning{background:rgba(251,191,36,0.1);border:2px solid rgba(251,191,36,0.3)}
.info-box.info{background:rgba(99,102,241,0.1);border:2px solid rgba(99,102,241,0.3)}
.info-box.danger{background:rgba(248,113,113,0.1);border:2px solid rgba(248,113,113,0.3)}
.info-box-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}

.stat-card{background:rgba(49,46,129,0.5);border-radius:14px;padding:14px;text-align:center;border:2px solid rgba(99,102,241,0.2);transition:all 0.3s}
.stat-card:hover{transform:translateY(-2px);border-color:rgba(99,102,241,0.3)}
.stat-value{font-family:'Fredoka One',cursive;font-size:26px}
.stat-label{font-size:10px;color:#a5b4fc;margin-top:4px}

.dropdown{background:rgba(30,27,75,0.98);border:2px solid rgba(99,102,241,0.3);border-radius:14px;max-height:180px;overflow-y:auto;position:absolute;left:0;right:0;top:100%;margin-top:8px;z-index:20}
.dropdown-item{padding:12px 14px;border-bottom:1px solid rgba(99,102,241,0.1);cursor:pointer;transition:all 0.2s;display:flex;align-items:center;gap:10px}
.dropdown-item:last-child{border-bottom:none}
.dropdown-item:hover{background:rgba(99,102,241,0.2)}
.dropdown-item:active{background:rgba(99,102,241,0.3)}

.teacher-card{display:flex;align-items:center;gap:12px;padding:14px;background:rgba(49,46,129,0.5);border-radius:14px;border:2px solid rgba(99,102,241,0.2)}
.teacher-avatar{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}

.topbar{background:rgba(30,27,75,0.9);backdrop-filter:blur(15px);border-bottom:1px solid rgba(99,102,241,0.2);position:sticky;top:0;z-index:50;padding:12px 16px}

/* TIMER BAR */
.timer-bar{background:rgba(30,27,75,0.95);backdrop-filter:blur(15px);border-bottom:2px solid rgba(99,102,241,0.3);padding:10px 16px;display:flex;align-items:center;justify-content:center;gap:12px;position:sticky;top:0;z-index:60}
.timer-display{font-family:'Fredoka One',cursive;font-size:28px;letter-spacing:2px}
.timer-display.safe{color:#4ade80}
.timer-display.warn{color:#fbbf24}
.timer-display.danger{color:#f87171;animation:urgentPulse 1s infinite}
.timer-label{font-size:11px;color:#a5b4fc;font-weight:600}
.timer-progress{height:4px;background:rgba(99,102,241,0.2);border-radius:2px;flex:1;overflow:hidden}
.timer-progress-fill{height:100%;border-radius:2px;transition:width 1s linear}

/* LOCK OVERLAY - muncul saat ujian aktif */
.lock-overlay{position:fixed;inset:0;z-index:9999;background:rgba(30,27,75,0.97);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px}
.lock-overlay.hidden{display:none}

@media print{.no-print{display:none!important}}
</style>
</head>
<body>
<div class="floating-shapes">
  <div class="shape shape-1"></div>
  <div class="shape shape-2"></div>
  <div class="shape shape-3"></div>
  <div class="shape shape-4"></div>
</div>
<div class="stars" id="starsContainer"></div>
<div class="confetti-container" id="confettiContainer"></div>
<div id="toastContainer"></div>

<!-- LOCK OVERLAY: muncul saat ujian, blokir semua -->
<div id="lockOverlay" class="lock-overlay hidden">
  <div style="width:120px;height:120px;border-radius:50%;background:rgba(248,113,113,0.15);display:flex;align-items:center;justify-content:center;animation:pulse 2s infinite">
    <i class="fas fa-lock" style="font-size:48px;color:#f87171"></i>
  </div>
  <h2 style="font-family:'Fredoka One',cursive;font-size:24px;color:#f87171;text-align:center">UJIAN BERLANGSUNG</h2>
  <p style="color:#a5b4fc;font-size:14px;text-align:center;max-width:300px">Jangan keluar dari halaman ini. Jika Anda keluar, ujian akan otomatis dikirim.</p>
  <button onclick="cancelLock()" style="margin-top:10px;padding:12px 32px;border-radius:14px;background:rgba(248,113,113,0.2);border:2px solid #f87171;color:#f87171;font-weight:700;font-size:14px;cursor:pointer;font-family:'Nunito',sans-serif">
    <i class="fas fa-arrow-left" style="margin-right:6px"></i>Kembali ke Ujian
  </button>
</div>

<!-- ===== LOGIN PAGE ===== -->
<div id="loginPage" class="min-h-screen flex items-center justify-content p-4 relative z-10">
  <div class="glass p-5 w-full max-w-sm slide-up">
    <div class="mascot happy" id="loginMascot">
      <div class="mascot-body"><div class="mascot-face">
        <div class="mascot-eye left"></div><div class="mascot-eye right"></div>
        <div class="mascot-mouth"></div>
        <div class="mascot-cheek left"></div><div class="mascot-cheek right"></div>
      </div></div>
    </div>
    <div class="text-center mb-4">
      <h1 class="font-display text-xl text-light mb-1">Halo Teman</h1>
      <p class="text-xs text-a5b4fc">Siap mengerjakan ujian hari ini?</p>
    </div>

    <div class="step-container">
      <div class="step-item"><div class="step-circle active" id="step1Circle">1</div><span class="step-label active" id="step1Label">Kelas</span></div>
      <div class="step-line" id="line1"></div>
      <div class="step-item"><div class="step-circle inactive" id="step2Circle">2</div><span class="step-label" id="step2Label">Ujian</span></div>
      <div class="step-line" id="line2"></div>
      <div class="step-item"><div class="step-circle inactive" id="step3Circle">3</div><span class="step-label" id="step3Label">Nama</span></div>
      <div class="step-line" id="line3"></div>
      <div class="step-item"><div class="step-circle inactive" id="step4Circle">4</div><span class="step-label" id="step4Label">Token</span></div>
    </div>

    <!-- STEP 1: Kelas & Rombel -->
    <div id="step1Content">
      <div id="schoolInfoBox" class="info-box info mb-3 hidden">
        <div class="info-box-icon bg-primary/30"><i class="fas fa-school text-primary"></i></div>
        <div class="flex-1 min-w-0">
          <p class="text-sm font-semibold text-light truncate" id="schoolName"></p>
          <p class="text-xs text-a5b4fc">NPSN: <span id="schoolNpsn"></span></p>
        </div>
      </div>
      <div class="mb-3">
        <label class="text-xs text-a5b4fc font-semibold mb-2 block">Pilih Kelasmu</label>
        <div class="grid grid-cols-4 gap-2 mb-3" id="kelasGrid"></div>
      </div>
      <div class="mb-3">
        <label class="text-xs text-a5b4fc font-semibold mb-2 block">Pilih Rombel</label>
        <div class="grid grid-cols-3 gap-2" id="rombelGrid"></div>
      </div>
      <div id="teacherBox" class="hidden mb-3">
        <label class="text-xs text-a5b4fc font-semibold mb-2 block">Wali Kelasmu</label>
        <div id="teacherCard" class="teacher-card"></div>
      </div>
      <button onclick="goToStep2()" id="btnStep1" class="btn-primary w-full" disabled>
        <span>Lanjut</span><i class="fas fa-arrow-right"></i>
      </button>
    </div>

    <!-- STEP 2: Pilih Ujian -->
    <div id="step2Content" class="hidden">
      <div id="examTypeContainer" class="space-y-3 mb-3"></div>
      <div id="mapelContainer" class="hidden mb-3"></div>
      <button onclick="goToStep3()" id="btnStep2" class="btn-primary w-full" disabled>

<script>
/* ================================================================

var firebaseConfig = {

  authDomain: "pembuatan-soal.firebaseapp.com",

  appId: "1:56200686194:web:eb2de00c9d152d87bcf0eb"
};
firebase.initializeApp(firebaseConfig);
var db = firebase.firestore();

/* ================================================================
   DATA MAPEL
   ================================================================ */
var MAPEL_LIST = [
  {id:'ppkn',nama:'Pendidikan Pancasila',singkat:'PPKn',icon:'fa-balance-scale',color:'#6366f1'},
  {id:'mat',nama:'Matematika',singkat:'MTK',icon:'fa-calculator',color:'#8b5cf6'},

];

/* ================================================================
   STATE GLOBAL
   ================================================================ */
var guruList = [];
var siswaList = [];
var questions = [];
var pajQuestions = [];
var nilaiList = [];
var currentStep = 1;
var selectedKelas = null;
var selectedRombel = null;
var selectedGuru = null;
var selectedMapel = null;
var selectedExamType = null;
var tokenValidated = false;
var sessionData = null;
var studentName = "";
var examTimerInterval = null;
var examDurationSeconds = 0;
var examRemainingSeconds = 0;
var examActive = false;

/* ================================================================
   UTILITAS
   ================================================================ */
function getMapel(id) {
  if (id === 'paj') return PAJ_M;
  for (var i = 0; i < MAPEL_LIST.length; i++) {
    if (MAPEL_LIST[i].id === id) return MAPEL_LIST[i];
  }
  return {id:id, nama:id, singkat:id, icon:'fa-book', color:'#6366f1'};
}

function escHtml(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.textContent = String(s);
  return d.innerHTML;
}

function getOptLetters(kelas) {
  var n = parseInt((kelas || '').replace('Kelas ', '')) || 4;
  if (n <= 2) return ['a','b','c'];
  if (n === 6) return ['a','b','c','d','e'];
  return ['a','b','c','d'];
}

function showToast(msg, type) {
  type = type || 'success';
  var container = document.getElementById('toastContainer');
  var toast = document.createElement('div');
  var icon = type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-times-circle' : 'fa-info-circle';
  toast.className = 'toast toast-' + type;
  toast.innerHTML = '<i class="fas ' + icon + '"></i><span>' + msg + '</span>';
  container.appendChild(toast);
  setTimeout(function() { if (toast.parentNode) toast.remove(); }, 3500);
}

/* ================================================================
   SUPERKETAT: Blokir semua cara keluar saat ujian
   ================================================================ */
function activateLock(){
  examActive = true;
  document.getElementById('lockOverlay').classList.remove('hidden');
}

function cancelLock(){
  document.getElementById('lockOverlay').classList.add('hidden');
}

/* Blokir tombol back */
history.pushState(null, null, location.href);
history.pushState(null, null, location.href);
window.addEventListener('popstate', function(e){
  if(examActive){
    history.pushState(null, null, location.href);
    activateLock();
  }
});

/* Blokir keyboard shortcut */
document.addEventListener('keydown', function(e){
  if(!examActive) return;
  /* Blokir Ctrl+R, F5, Ctrl+W, Ctrl+Shift+I, Ctrl+U, Ctrl+S, Ctrl+P, Ctrl+Shift+J, F12 */
  if(e.key==='F5'||e.key==='F12'){e.preventDefault();e.stopPropagation();activateLock();return;}
  if(e.ctrlKey&&e.shiftKey&&(e.key==='I'||e.key==='i'||e.key==='J'||e.key==='j')){e.preventDefault();e.stopPropagation();activateLock();return;}
  if(e.ctrlKey&&(e.key==='r'||e.key==='R'||e.key==='w'||e.key==='W'||e.key==='u'||e.key==='U'||e.key==='s'||e.key==='S'||e.key==='p'||e.key==='P')){e.preventDefault();e.stopPropagation();activateLock();return;}
  if(e.altKey&&(e.key==='F4'||e.key==='Left')){e.preventDefault();e.stopPropagation();activateLock();return;}
});

/* Blokir context menu (right-click) */
document.addEventListener('contextmenu', function(e){
  if(examActive){e.preventDefault();activateLock();}
});

/* Blokir copy, cut, paste saat ujian */
document.addEventListener('copy', function(e){ if(examActive){e.preventDefault();} });
document.addEventListener('cut', function(e){ if(examActive){e.preventDefault();} });
document.addEventListener('paste', function(e){ if(examActive){e.preventDefault();} });

/* Deteksi visibility change (tab switch / minimize) */
document.addEventListener('visibilitychange', function(){
  if(examActive && document.hidden){
    activateLock();
  }
});

/* Deteksi window blur (klik di luar) */
window.addEventListener('blur', function(){
  if(examActive){
    activateLock();
  }
});

/* Deteksi beforeunload (close tab / refresh) */
window.addEventListener('beforeunload', function(e){
  if(examActive){
    e.preventDefault();
    e.returnValue = 'Ujian sedang berlangsung! Apakah Anda yakin ingin keluar?';
    return e.returnValue;
  }
});

/* Blokir drag */
document.addEventListener('dragstart', function(e){ if(examActive){e.preventDefault();} });

/* ================================================================
   UI DECORATIONS
   ================================================================ */
function generateStars() {
  var container = document.getElementById('starsContainer');
  for (var i = 0; i < 25; i++) {
    var star = document.createElement('div');
    star.className = 'star';
    star.style.left = Math.random() * 100 + '%';
    star.style.top = Math.random() * 100 + '%';
    star.style.animationDelay = Math.random() * 2 + 's';
    container.appendChild(star);
  }
}

function showConfetti() {
  var container = document.getElementById('confettiContainer');
  var colors = ['#6366f1','#f472b6','#22d3ee','#4ade80','#fbbf24','#f87171','#a78bfa'];
  for (var i = 0; i < 50; i++) {
    var conf = document.createElement('div');
    conf.className = 'confetti';
    conf.style.left = Math.random() * 100 + '%';
    conf.style.bottom = '-10px';
    conf.style.background = colors[Math.floor(Math.random() * colors.length)];
    conf.style.animationDelay = Math.random() * 2 + 's';
    container.appendChild(conf);
    (function(c){ setTimeout(function(){ c.remove(); }, 3500); })(conf);
  }
}

/* ================================================================
   STEP NAVIGATION
   ================================================================ */
function updateStepUI(step) {
  currentStep = step;
  for (var i = 1; i <= 4; i++) {
    var circle = document.getElementById('step' + i + 'Circle');
    var label = document.getElementById('step' + i + 'Label');
    var line = document.getElementById('line' + i);
    circle.className = 'step-circle ' + (i < step ? 'done' : i === step ? 'active' : 'inactive');
    label.className = 'step-label ' + (i < step ? 'done' : i === step ? 'active' : '');
    if (i < step) { circle.innerHTML = '<i class="fas fa-check" style="font-size:10px"></i>'; }
    else { circle.textContent = i; }
    if (line) { line.className = 'step-line' + (i < step ? ' done' : ''); }
  }
  for (var i = 1; i <= 4; i++) {
    var content = document.getElementById('step' + i + 'Content');
    if (content) content.classList.toggle('hidden', i !== step);
  }
}

/* ================================================================
   FIREBASE LISTENERS
   ================================================================ */
function initApp() {
  generateStars();

  db.collection('guru_panel').onSnapshot(function(snap) {
    guruList = snap.docs.map(function(d) { return Object.assign({id: d.id}, d.data()); });
    renderKelasRombelSelection();
  });

  db.collection('siswa_panel').onSnapshot(function(snap) {
    siswaList = snap.docs.map(function(d) { return Object.assign({id: d.id}, d.data()); });
  });

  db.collection('questions').orderBy('createdAt', 'asc').onSnapshot(function(snap) {
    questions = snap.docs.map(function(d) { return Object.assign({id: d.id}, d.data()); });
  });

  /* FIX: PAJ dari questions_paj */
  db.collection('questions_paj').orderBy('createdAt', 'asc').onSnapshot(function(snap) {
    pajQuestions = snap.docs.map(function(d) { return Object.assign({id: d.id}, d.data()); });
  });

  db.collection('nilai_panel').onSnapshot(function(snap) {
    nilaiList = snap.docs.map(function(d) { return Object.assign({id: d.id}, d.data()); });
  });
}

/* ================================================================
   STEP 1: KELAS & ROMBEL
   ================================================================ */
function renderKelasRombelSelection() {
  var kelasGrid = document.getElementById('kelasGrid');
  var rombelGrid = document.getElementById('rombelGrid');

  var kelasHtml = '';
  for (var i = 1; i <= 6; i++) {
    kelasHtml += '<div class="select-card" id="kelas_' + i + '" onclick="selectKelas(' + i + ')">';
    kelasHtml += '<div class="card-icon" style="width:32px;height:32px;margin:0 auto 4px;background:rgba(99,102,241,0.2);border-radius:8px;display:flex;align-items:center;justify-content:center">';
    kelasHtml += '<span class="font-bold text-primary">' + i + '</span></div>';
    kelasHtml += '<span class="text-xs text-a5b4fc">Kelas ' + i + '</span></div>';
  }
  kelasGrid.innerHTML = kelasHtml;

  var rombelHtml = '';
  ['A','B','C'].forEach(function(r) {
    rombelHtml += '<div class="select-card" id="rombel_' + r + '" onclick="selectRombel(\'' + r + '\')">';
    rombelHtml += '<div class="card-icon" style="width:32px;height:32px;margin:0 auto 4px;background:rgba(236,72,153,0.2);border-radius:8px;display:flex;align-items:center;justify-content:center">';
    rombelHtml += '<span class="font-bold text-secondary">' + r + '</span></div>';
    rombelHtml += '<span class="text-xs text-a5b4fc">Rombel ' + r + '</span></div>';
  });
  rombelGrid.innerHTML = rombelHtml;

  checkStep1Complete();
}

function selectKelas(k) {
  selectedKelas = 'Kelas ' + k;
  document.querySelectorAll('[id^="kelas_"]').forEach(function(el) { el.classList.remove('selected'); });
  document.getElementById('kelas_' + k).classList.add('selected','pop');
  setTimeout(function() { document.getElementById('kelas_' + k).classList.remove('pop'); }, 400);
  selectedRombel = null;
  selectedGuru = null;
  document.querySelectorAll('[id^="rombel_"]').forEach(function(el) { el.classList.remove('selected'); });
  document.getElementById('teacherBox').classList.add('hidden');
  document.getElementById('schoolInfoBox').classList.add('hidden');
  document.getElementById('btnStep1').disabled = true;
  checkStep1Complete();
}

function selectRombel(r) {
  selectedRombel = r;
  document.querySelectorAll('[id^="rombel_"]').forEach(function(el) { el.classList.remove('selected'); });
  document.getElementById('rombel_' + r).classList.add('selected','pop');
  setTimeout(function() { document.getElementById('rombel_' + r).classList.remove('pop'); }, 400);
  checkStep1Complete();
}

function checkStep1Complete() {
  var btn = document.getElementById('btnStep1');
  var teacherBox = document.getElementById('teacherBox');
  var teacherCard = document.getElementById('teacherCard');
  var schoolInfoBox = document.getElementById('schoolInfoBox');
  btn.disabled = true;
  teacherBox.classList.add('hidden');
  schoolInfoBox.classList.add('hidden');
  selectedGuru = null;

  if (!selectedKelas || !selectedRombel) return;

  var matchedGuru = null;
  for (var i = 0; i < guruList.length; i++) {
    var g = guruList[i];
    var key = selectedKelas.replace(' ','') + '_' + selectedRombel;
    if (g.kelasRombel && g.kelasRombel[key] && g.isGuruKelas) {
      matchedGuru = g;
      break;
    }
    if (g.kelas === selectedKelas && g.rombel === selectedRombel && g.jabatan === 'Guru Kelas') {
      matchedGuru = g;
      break;
    }
  }

  if (matchedGuru) {
    selectedGuru = matchedGuru;
    schoolInfoBox.classList.remove('hidden');
    document.getElementById('schoolName').textContent = matchedGuru.sekolah;
    document.getElementById('schoolNpsn').textContent = matchedGuru.npsn;
    teacherBox.classList.remove('hidden');
    teacherCard.innerHTML = '<div class="teacher-avatar"><i class="fas fa-chalkboard-teacher text-white"></i></div>';
    teacherCard.innerHTML += '<div class="flex-1 min-w-0"><p class="text-sm font-semibold text-light">' + escHtml(matchedGuru.nama) + '</p>';
    teacherCard.innerHTML += '<p class="text-xs text-a5b4fc">Wali Kelas ' + selectedKelas.replace('Kelas ','') + ' ' + selectedRombel + '</p></div>';
    btn.disabled = false;
  } else {
    showToast('Tidak ada wali kelas untuk ' + selectedKelas + ' Rombel ' + selectedRombel, 'error');
  }
}

function goToStep2() {
  if (!selectedGuru) { showToast('Pilih kelas dan rombel dulu','error'); return; }
  updateStepUI(2);
  renderStep2();
}

/* ================================================================
   STEP 2: PILIH UJIAN & MAPEL
   ================================================================ */
function getAllAvailableMapels() {
  var kelas = selectedKelas;
  var rombel = selectedRombel;
  var krKey = kelas.replace(' ','') + '_' + rombel;
  var mapelSet = {};
  var tokenSources = {};

  for (var i = 0; i < guruList.length; i++) {
    var g = guruList[i];
    var ampus = false;
    if (g.kelasRombel && g.kelasRombel[krKey]) ampus = true;
    if (g.kelas === kelas && g.rombel === rombel) ampus = true;
    if (!ampus) continue;

    var tm = g.tokenMapel || {};
    Object.keys(tm).forEach(function(mid) {
      if (!mapelSet[mid]) {
        mapelSet[mid] = true;
        tokenSources[mid] = {
          guruId: g.id,
          guruNama: g.nama,
          token: tm[mid],
          durasi: (g.durasiMapel || {})[mid] || 0
        };
      }
    });
  }

  return tokenSources;
}

function renderStep2() {
  var container = document.getElementById('examTypeContainer');
  var mapelContainer = document.getElementById('mapelContainer');
  var isKelas6 = selectedKelas === 'Kelas 6';
  var available = getAllAvailableMapels();
  var availKeys = Object.keys(available);

  var satMapels = [];
  var hasPAJ = false;

  for (var i = 0; i < availKeys.length; i++) {
    var mid = availKeys[i];
    if (mid === 'paj') { hasPAJ = true; }
    else { satMapels.push(getMapel(mid)); }
  }

  var html = '';

  if (isKelas6 && hasPAJ) {
    var pajSrc = available['paj'];
    var durText = pajSrc.durasi > 0 ? '<p class="text-xs text-warning mt-0.5"><i class="fas fa-clock mr-1"></i>' + formatDurasiText(pajSrc.durasi) + '</p>' : '';
    html += '<div class="select-card" id="cardPAJ" onclick="selectExam(\'paj\')">';
    html += '<div class="card-icon" style="width:48px;height:48px;margin:0 auto 8px;background:rgba(248,113,113,0.2);border-radius:14px;display:flex;align-items:center;justify-content:center">';
    html += '<i class="fas fa-graduation-cap text-danger text-xl"></i></div>';
    html += '<p class="font-bold text-light text-sm">Penilaian Akhir Jenjang</p>';
    html += '<p class="text-xs text-a5b4fc mt-1">PAJ — Kelas 6</p>';
    html += '<p class="text-xs text-a5b4fc mt-0.5" style="font-size:10px">Guru: ' + escHtml(pajSrc.guruNama) + '</p>';
    html += durText;
    html += '</div>';
  }

  if (satMapels.length > 0) {
    html += '<div class="select-card" id="cardSAT" onclick="selectExam(\'sat\')">';
    html += '<div class="card-icon" style="width:48px;height:48px;margin:0 auto 8px;background:rgba(99,102,241,0.2);border-radius:14px;display:flex;align-items:center;justify-content:center">';
    html += '<i class="fas fa-file-alt text-primary text-xl"></i></div>';
    html += '<p class="font-bold text-light text-sm">Sumatif Akhir Tahun</p>';
    html += '<p class="text-xs text-a5b4fc mt-1">SAT — ' + selectedKelas + ' (' + satMapels.length + ' mapel)</p>';
    html += '</div>';
  }

  if (!hasPAJ && satMapels.length === 0) {
    html += '<div class="text-center py-6"><p class="text-sm text-a5b4fc"><i class="fas fa-inbox mr-2"></i>Belum ada ujian tersedia</p></div>';
  }

  container.innerHTML = html;
  mapelContainer.classList.add('hidden');
  document.getElementById('btnStep2').disabled = true;
  selectedMapel = null;
  selectedExamType = null;
}

function formatDurasiText(menit) {
  if (!menit) return '';
  var h = Math.floor(menit / 60), m = menit % 60;
  if (h > 0 && m > 0) return h + ' jam ' + m + ' menit';
  if (h > 0) return h + ' jam';
  return m + ' menit';
}

function selectExam(type) {
  selectedExamType = type;
  selectedMapel = null;
  tokenValidated = false;

  document.querySelectorAll('#examTypeContainer .select-card').forEach(function(c) { c.classList.remove('selected'); });
  document.getElementById('mapelContainer').classList.add('hidden');
  document.getElementById('btnStep2').disabled = true;

  if (type === 'paj') {
    selectedMapel = 'paj';
    document.getElementById('cardPAJ').classList.add('selected');
    document.getElementById('btnStep2').disabled = false;
  } else {
    document.getElementById('cardSAT').classList.add('selected');
    renderMapelSelection();
  }
}

function renderMapelSelection() {
  var available = getAllAvailableMapels();
  var availKeys = Object.keys(available);
  var mapels = [];

  for (var i = 0; i < availKeys.length; i++) {
    if (availKeys[i] !== 'paj') mapels.push(getMapel(availKeys[i]));
  }

  var container = document.getElementById('mapelContainer');
  var html = '<p class="text-xs text-a5b4fc font-semibold mb-2">Pilih Mata Pelajaran:</p>';
  html += '<div class="grid grid-cols-2 gap-2">';

  for (var i = 0; i < mapels.length; i++) {
    var m = mapels[i];
    var src = available[m.id];
    var durBadge = src.durasi > 0 ? '<p class="text-xs text-warning" style="font-size:9px"><i class="fas fa-clock mr-1"></i>' + formatDurasiText(src.durasi) + '</p>' : '';
    html += '<div class="mapel-card" onclick="selectMapel(\'' + m.id + '\')">';
    html += '<div class="mapel-icon" style="background:' + m.color + '20"><i class="fas ' + m.icon + '" style="color:' + m.color + '"></i></div>';
    html += '<div class="min-w-0 flex-1">';
    html += '<p class="text-xs font-semibold text-light truncate">' + escHtml(m.singkat) + '</p>';
    html += '<p class="text-xs text-a5b4fc" style="font-size:9px">' + escHtml(src.guruNama) + '</p>';
    html += durBadge;
    html += '</div></div>';
  }

  html += '</div>';
  container.innerHTML = html;
  container.classList.remove('hidden');
  document.getElementById('btnStep2').disabled = true;
}

function selectMapel(id) {
  selectedMapel = id;
  document.querySelectorAll('.mapel-card').forEach(function(c) { c.classList.remove('selected'); });
  event.currentTarget.classList.add('selected');
  document.getElementById('btnStep2').disabled = false;
}

function goToStep3() {

function startExam() {
  if (!tokenValidated) { showToast('Token belum valid','error'); return; }

  var isPaj = selectedMapel === 'paj';
  /* FIX: PAJ dari pajQuestions */
  var source = isPaj ? pajQuestions : questions;

  });

  if (!availableQ.length) {
    showToast('Belum ada soal untuk ujian ini. Hubungi guru.','error');
    return;
  }

  var available = getAllAvailableMapels();
  var src = available[selectedMapel];
  var guruMapelId = src ? src.guruId : selectedGuru.id;
  var durasiMenit = src ? src.durasi : 0;

  var sudahSelesai = false;
  for (var i = 0; i < nilaiList.length; i++) {
    var n = nilaiList[i];
    if (n.mapel === selectedMapel && n.kelas === selectedKelas &&
        n.rombel === selectedRombel && n.nama === studentName &&

   ================================================================ */
function initExam() {
  document.getElementById('topNama').textContent = sessionData.nama;
  document.getElementById('topSekolah').textContent = sessionData.guruWali.sekolah;
  var mapel = getMapel(sessionData.mapel);

  /* Setup timer jika ada durasi */
  setupTimer();
  renderQuestions();
}

/* ================================================================
   TIMER: Baca dari durasiMapel guru
   ================================================================ */
function setupTimer() {
  var container = document.getElementById('timerBarContainer');
  var durasi = sessionData.durasiMenit || 0;

  if (durasi <= 0) {
    container.classList.add('hidden');
    container.innerHTML = '';
    return;
  }

  examDurationSeconds = durasi * 60;
  examRemainingSeconds = examDurationSeconds;

  container.classList.remove('hidden');
  container.innerHTML = buildTimerHTML(examRemainingSeconds, examDurationSeconds);

  examTimerInterval = setInterval(function() {
    examRemainingSeconds--;
    if (examRemainingSeconds <= 0) {
      examRemainingSeconds = 0;
      clearInterval(examTimerInterval);
      examTimerInterval = null;
      container.innerHTML = buildTimerHTML(0, examDurationSeconds);
      showToast('Waktu habis! Jawaban otomatis dikirim.','error');
      setTimeout(function() { submitExam(); }, 1000);
      return;
    }
    container.innerHTML = buildTimerHTML(examRemainingSeconds, examDurationSeconds);
  }, 1000);
}

function buildTimerHTML(remaining, total) {
  var pct = total > 0 ? (remaining / total * 100) : 0;
  var m = Math.floor(remaining / 60);
  var s = remaining % 60;
  var timeStr = (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;

  var colorClass = 'safe';
  if (pct <= 10) colorClass = 'danger';
  else if (pct <= 25) colorClass = 'warn';

  var barColor = '#4ade80';
  if (pct <= 10) barColor = '#f87171';
  else if (pct <= 25) barColor = '#fbbf24';

  return '<div class="timer-bar">' +
    '<i class="fas fa-clock" style="color:' + barColor + ';font-size:16px"></i>' +
    '<div class="timer-label">SISA WAKTU</div>' +
    '<div class="timer-display ' + colorClass + '">' + timeStr + '</div>' +
    '<div class="timer-progress"><div class="timer-progress-fill" style="width:' + pct + '%;background:' + barColor + '"></div></div>' +
    '</div>';
}

  html += '<p class="text-xs text-light"><strong>Penting:</strong> Ujian hanya bisa dikerjakan sekali! Jangan keluar dari halaman ini.</p></div>';

  html += '<div class="mb-4"><div class="flex justify-between text-xs text-a5b4fc mb-1"><span>Progress</span><span id="progressText">0/' + pgQ.length + '</span></div>';
  html += '<div class="progress-container"><div class="progress-bar" id="progressBar" style="width:0%"></div></div></div>';

function selectOption(qIdx, oIdx) {
  document.querySelectorAll('[id^="opt_' + qIdx + '_"]').forEach(function(el) { el.classList.remove('selected'); });
  var opt = document.getElementById('opt_' + qIdx + '_' + oIdx);
  if (opt) { opt.classList.add('selected','pop'); setTimeout(function(){ opt.classList.remove('pop'); }, 400); }
  updateProgress();
}

function updateProgress() {
  var pgCards = document.querySelectorAll('.question-card:not([style*="border-left:4px solid #22d3ee"])');
  var total = pgCards.length;
  var answered = 0;
  pgCards.forEach(function(card) {
    if (card.querySelector('.option-item.selected')) answered++;
  });
  var bar = document.getElementById('progressBar');
  var text = document.getElementById('progressText');
  if (bar) bar.style.width = (total > 0 ? Math.round(answered / total * 100) : 0) + '%';
  if (text) text.textContent = answered + '/' + total;
}

/* ================================================================
   SUBMIT UJIAN
   ================================================================ */
function submitExam() {
  var btn = document.getElementById('submitBtn');
  if (btn) { btn.disabled = true; btn.innerHTML = '<div class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></div><span>Mengirim...</span>'; }

  var m = sessionData.mapel;
  var k = sessionData.kelas;
  var isPaj = m === 'paj';
  /* FIX: PAJ dari pajQuestions */
  var source = isPaj ? pajQuestions : questions;

  var allQ = source.filter(function(q) {
    if (!isPaj) return q.kelas === k && q.mapel === m;
    return true;
  });

  var pgQ = allQ.filter(function(q) { return q.type === 'pg'; });
  var letters = getOptLetters(k);

  var pgMax = 0;
  for (var i = 0; i < pgQ.length; i++) pgMax += (pgQ[i].score || 1);

  var unanswered = [];
  for (var i = 0; i < pgQ.length; i++) {
    if (!document.querySelector('[id^="opt_' + i + '_"].selected')) unanswered.push(i + 1);
  }
  if (unanswered.length && !confirm('Soal nomor ' + unanswered.join(', ') + ' belum dijawab. Yakin kirim?')) {
    if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-paper-plane"></i><span>Selesai dan Kirim Nilai</span>'; }
    return;
  }

  var pgSkor = 0;
  var pgDetail = [];

  for (var i = 0; i < pgQ.length; i++) {
    var q = pgQ[i];
    var selEl = document.querySelector('[id^="opt_' + i + '_"].selected');
    var jawaban = '';
    if (selEl) {
      var idx = parseInt(selEl.id.split('_')[2]);
      jawaban = letters[idx] ? letters[idx].toUpperCase() : '';
    }
    var kunci = (q.answer || '').toUpperCase();
    var benar = jawaban === kunci;
    if (benar) pgSkor += (q.score || 1);
    pgDetail.push({ no: i+1, kunci: kunci, jawaban: jawaban, benar: benar, soal: q.text });
  }

  var nilaiAkhir = calculateScore(pgSkor, 0, pgMax, 0);
  var benarCount = 0;
  for (var i = 0; i < pgDetail.length; i++) { if (pgDetail[i].benar) benarCount++; }

  var data = {
    guruId: sessionData.guruId,
    npsn: sessionData.guruWali.npsn,
    sekolah: sessionData.guruWali.sekolah,
    kelas: k,
    rombel: sessionData.rombel,
    mapel: m,
    nama: sessionData.nama,
    absen: 0,
    pgSkor: pgSkor,
    urSkor: 0,
    pgMax: pgMax,
    urMax: 0,
    nilaiAkhir: nilaiAkhir,
    pgDetail: pgDetail,
    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    source: 'siswa_panel'
  };

  db.collection('nilai_panel').add(data).then(function() {
    examActive = false;
    if (examTimerInterval) { clearInterval(examTimerInterval); examTimerInterval = null; }
    showResult(nilaiAkhir, pgSkor, pgMax, benarCount, pgQ.length, pgDetail);
    showToast('Nilai berhasil dikirim!');
    if (nilaiAkhir >= 70) showConfetti();
  }).catch(function(e) {
    showToast('Gagal mengirim: ' + (e.message || ''), 'error');
    if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-paper-plane"></i><span>Selesai dan Kirim Nilai</span>'; }
  });
}

function calculateScore(pg, ur, pm, um) {
  if (!pm && !um) return 0;
  if (!pm) return Math.round(ur / um * 100);
  if (!um) return Math.round(pg / pm * 100);
  return Math.round((pg / pm * 40) + (ur / um * 60));
}

/* ================================================================
   HASIL UJIAN
   ================================================================ */
function showResult(nilai, pgSkor, pgMax, benar, total, pgDetail) {
  var isLulus = nilai >= 70;
  var predikat = nilai >= 90 ? 'A' : nilai >= 80 ? 'B' : nilai >= 70 ? 'C' : nilai >= 60 ? 'D' : 'E';
  var pct = pgMax > 0 ? Math.round(pgSkor / pgMax * 100) : 0;

  document.getElementById('questionsContainer').style.display = 'none';
  document.getElementById('timerBarContainer').classList.add('hidden');
  document.getElementById('examTopbar').style.display = 'none';
  document.querySelectorAll('.no-print').forEach(function(el) { el.style.display = 'none'; });

  var html = '<div class="slide-up">';
  html += '<div class="result-card mb-6">';
  html += '<div class="mascot ' + (isLulus ? 'celebrate' : 'sad') + ' mb-4"><div class="mascot-body"><div class="mascot-face">';
  html += '<div class="mascot-eye left"></div><div class="mascot-eye right"></div><div class="mascot-mouth"></div>';
  html += '<div class="mascot-cheek left"></div><div class="mascot-cheek right"></div></div></div></div>';
  html += '<p class="text-xs text-a5b4fc mb-1">Nilai Kamu</p>';
  html += '<p class="score-display ' + (isLulus ? 'success' : 'fail') + '">' + nilai + '</p>';
  html += '<p class="text-lg font-bold mt-2 ' + (isLulus ? 'text-success' : 'text-danger') + '">Predikat ' + predikat + '</p>';
  html += '<p class="text-sm ' + (isLulus ? 'text-success' : 'text-danger') + ' mt-1">';
  html += isLulus ? '<i class="fas fa-trophy mr-1"></i>Hebat! Kamu tuntas!' : '<i class="fas fa-heart mr-1"></i>Tetap semangat!</p></div>';

  html += '<div class="grid grid-cols-3 gap-3 mb-6">';
  html += '<div class="stat-card"><p class="stat-value text-success">' + benar + '</p><p class="stat-label">Benar</p></div>';
  html += '<div class="stat-card"><p class="stat-value text-primary">' + pgSkor + '</p><p class="stat-label">Skor (' + pct + '%)</p></div>';
  html += '<div class="stat-card"><p class="stat-value ' + (isLulus ? 'text-success' : 'text-danger') + '">' + (isLulus ? 'Tuntas' : 'Belum') + '</p><p class="stat-label">Status</p></div></div>';

  html += '<div class="info-box success mb-6"><div class="info-box-icon bg-success/30"><i class="fas fa-check-circle text-success"></i></div><p class="text-sm text-success">Nilai sudah terkirim ke guru</p></div>';

  html += '<div class="mb-6"><h4 class="text-sm font-bold text-light mb-3 flex items-center gap-2"><i class="fas fa-book-open text-primary"></i>Pembahasan Jawaban</h4><div class="space-y-2">';

  for (var i = 0; i < pgDetail.length; i++) {
    var d = pgDetail[i];
    html += '<div class="question-card" style="padding:14px;border-color:' + (d.benar ? 'rgba(74,222,128,0.3)' : 'rgba(248,113,113,0.3)') + '">';
    html += '<div class="flex items-center gap-2 mb-2"><span class="question-number" style="background:' + (d.benar ? 'linear-gradient(135deg,#4ade80,#22c55e)' : 'linear-gradient(135deg,#f87171,#ef4444)') + '">' + d.no + '</span>';
    html += '<span class="text-xs font-semibold ' + (d.benar ? 'text-success' : 'text-danger') + '">';
    html += d.benar ? '<i class="fas fa-check-circle mr-1"></i>Benar' : '<i class="fas fa-times-circle mr-1"></i>Salah</span></div>';
    html += '<p class="text-xs text-a5b4fc mb-2" style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">' + escHtml(d.soal) + '</p>';
    html += '<div class="flex gap-4 text-xs">';
    html += '<span class="text-a5b4fc">Jawabmu: <span class="inline-flex items-center justify-center w-6 h-6 rounded-lg ' + (d.benar ? 'bg-success/30 text-success' : 'bg-danger/30 text-danger') + ' font-bold">' + (d.jawaban || '-') + '</span></span>';
    html += '<span class="text-a5b4fc">Kunci: <span class="inline-flex items-center justify-center w-6 h-6 rounded-lg bg-success/30 text-success font-bold">' + escHtml(d.kunci) + '</span></span></div></div>';
  }
  html += '</div></div>';
  html += '<button onclick="logoutExam()" class="btn-secondary w-full mb-8"><i class="fas fa-home mr-2"></i>Selesai dan Kembali</button></div>';

  document.getElementById('examContent').innerHTML = html;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ================================================================
   INIT
   ================================================================ */
window.onload = initApp;
</script>
</body>
</html>
