<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Panel Siswa - KOREK API Majalengka</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script>
tailwind.config={theme:{extend:{colors:{primary:'#6366f1',secondary:'#f472b6',accent:'#22d3ee',success:'#4ade80',warning:'#fbbf24',danger:'#f87171',dark:'#1e1b4b',card:'#312e81',light:'#f5f3ff'},fontFamily:{display:['Fredoka One','cursive'],body:['Nunito','sans-serif']}}}}
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none}
html,body{width:100%;overflow-x:hidden;font-family:'Nunito',sans-serif}
body{background:linear-gradient(135deg,#1e1b4b 0%,#312e81 50%,#4c1d95 100%);color:#f5f3ff;min-height:100vh;min-height:100dvh}

@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}
@keyframes wiggle{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes sparkle{0%,100%{opacity:0;transform:scale(0)}50%{opacity:1;transform:scale(1)}}
@keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes pop{0%{transform:scale(0)}80%{transform:scale(1.1)}100%{transform:scale(1)}}
@keyframes confetti{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(-100vh) rotate(720deg);opacity:0}}
@keyframes heartbeat{0%,100%{transform:scale(1)}25%{transform:scale(1.1)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes blink{0%,45%,55%,100%{transform:scaleY(1)}50%{transform:scaleY(0.1)}}
@keyframes shimmer{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
@keyframes urgentPulse{0%,100%{box-shadow:0 0 0 0 rgba(248,113,113,0.7)}50%{box-shadow:0 0 0 12px rgba(248,113,113,0)}}

.float{animation:float 3s ease-in-out infinite}
.bounce{animation:bounce 2s ease-in-out infinite}
.wiggle{animation:wiggle 1s ease-in-out infinite}
.pulse{animation:pulse 2s ease-in-out infinite}
.pop{animation:pop 0.4s cubic-bezier(0.68,-0.55,0.265,1.55)}
.slide-up{animation:slideUp 0.5s ease-out forwards}
.fade-in{animation:fadeIn 0.3s ease-out}

.floating-shapes{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.shape{position:absolute;border-radius:50%;opacity:0.12}
.shape-1{width:300px;height:300px;background:linear-gradient(135deg,#6366f1,#a855f7);top:-100px;right:-100px;animation:float 8s ease-in-out infinite}
.shape-2{width:200px;height:200px;background:linear-gradient(135deg,#22d3ee,#06b6d4);bottom:10%;left:-50px;animation:float 10s ease-in-out infinite reverse}
.shape-3{width:150px;height:150px;background:linear-gradient(135deg,#f472b6,#ec4899);top:40%;right:-30px;animation:bounce 6s ease-in-out infinite}
.shape-4{width:100px;height:100px;background:linear-gradient(135deg,#4ade80,#22c55e);bottom:20%;right:10%;animation:wiggle 5s ease-in-out infinite}

.stars{position:fixed;inset:0;pointer-events:none;z-index:1}
.star{position:absolute;width:4px;height:4px;background:#fbbf24;border-radius:50%;animation:sparkle 2s ease-in-out infinite}
.star:nth-child(odd){animation-delay:0.5s}

.glass{background:rgba(49,46,129,0.75);backdrop-filter:blur(20px);border:1px solid rgba(99,102,241,0.3);border-radius:20px;box-shadow:0 8px 32px rgba(0,0,0,0.3)}

.btn-primary{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:white;font-weight:700;padding:13px 24px;border-radius:14px;border:none;cursor:pointer;font-size:15px;font-family:'Nunito',sans-serif;display:flex;align-items:center;justify-content:center;gap:8px;transition:all 0.3s;box-shadow:0 8px 25px rgba(99,102,241,0.4);position:relative;overflow:hidden;width:100%}
.btn-primary::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,0.2),transparent);opacity:0;transition:opacity 0.3s}
.btn-primary:hover::before{opacity:1}
.btn-primary:active{transform:scale(0.97)}
.btn-primary:disabled{opacity:0.5;cursor:not-allowed;transform:none}

.btn-secondary{background:rgba(99,102,241,0.2);border:2px solid rgba(99,102,241,0.5);color:#f5f3ff;padding:11px 20px;border-radius:14px;cursor:pointer;font-size:13px;font-family:'Nunito',sans-serif;transition:all 0.3s;width:100%;text-align:center}
.btn-secondary:hover{background:rgba(99,102,241,0.3);border-color:#6366f1}

.input-field{background:rgba(30,27,75,0.8);border:2px solid rgba(99,102,241,0.3);color:#f5f3ff;padding:13px 16px;border-radius:12px;width:100%;font-size:15px;font-family:'Nunito',sans-serif;transition:all 0.3s}
.input-field:focus{outline:none;border-color:#6366f1;box-shadow:0 0 20px rgba(99,102,241,0.3)}
.input-field::placeholder{color:#a5b4fc}
.input-field.valid{border-color:#4ade80;box-shadow:0 0 16px rgba(74,222,128,0.2)}
.input-field.invalid{border-color:#f87171;box-shadow:0 0 16px rgba(248,113,113,0.2)}

.step-bar{display:flex;align-items:center;gap:0;margin-bottom:6px;overflow-x:auto;padding:4px 0;-ms-overflow-style:none;scrollbar-width:none}
.step-bar::-webkit-scrollbar{display:none}
.step-dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;flex-shrink:0;transition:all 0.4s}
.step-dot.inactive{background:rgba(99,102,241,0.15);color:#6366f1}
.step-dot.active{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:white;box-shadow:0 0 18px rgba(99,102,241,0.5);animation:pulse 2s ease-in-out infinite}
.step-dot.done{background:linear-gradient(135deg,#4ade80,#22c55e);color:white}
.step-connector{width:16px;height:2px;background:rgba(99,102,241,0.2);flex-shrink:0;border-radius:1px;transition:background 0.4s}
.step-connector.done{background:linear-gradient(90deg,#4ade80,#22c55e)}

.step-label-row{display:flex;align-items:flex-start;gap:0;margin-bottom:16px;overflow-x:auto;padding:0 2px;-ms-overflow-style:none;scrollbar-width:none}
.step-label-row::-webkit-scrollbar{display:none}
.step-lbl{flex-shrink:0;text-align:center;font-size:8px;font-weight:700;color:#4c4678;transition:color 0.3s;text-transform:uppercase;letter-spacing:0.3px}
.step-lbl.active{color:#a5b4fc}
.step-lbl.done{color:#4ade80}
.step-lbl-spacer{width:16px;flex-shrink:0}

.mascot{width:72px;height:72px;margin:0 auto;position:relative}
.mascot-body{width:60px;height:60px;background:linear-gradient(135deg,#fbbf24,#f59e0b);border-radius:50%;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);box-shadow:0 8px 24px rgba(251,191,36,0.4)}
.mascot-face{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);width:44px}
.mascot-eye{width:8px;height:11px;background:#1e1b4b;border-radius:50%;position:absolute;top:0;animation:blink 4s ease-in-out infinite}
.mascot-eye.left{left:7px}
.mascot-eye.right{right:7px}
.mascot-mouth{width:18px;height:9px;border-bottom:3px solid #1e1b4b;border-radius:0 0 18px 18px;position:absolute;top:16px;left:50%;transform:translateX(-50%)}
.mascot-cheek{width:10px;height:6px;background:#f472b6;opacity:0.6;border-radius:50%;position:absolute;top:10px}
.mascot-cheek.left{left:1px}
.mascot-cheek.right{right:1px}
.mascot.happy .mascot-body{animation:bounce 1s ease-in-out infinite}
.mascot.sad .mascot-mouth{border-radius:18px 18px 0 0;border-bottom:none;border-top:3px solid #1e1b4b}
.mascot.celebrate .mascot-body{animation:wiggle 0.5s ease-in-out infinite}

.select-card{padding:12px;border-radius:14px;cursor:pointer;transition:all 0.3s;border:2px solid rgba(99,102,241,0.2);background:rgba(49,46,129,0.4);text-align:center}
.select-card:hover{transform:translateY(-2px);border-color:rgba(99,102,241,0.5);box-shadow:0 6px 16px rgba(99,102,241,0.2)}
.select-card:active{transform:scale(0.98)}
.select-card.selected{border-color:#4ade80;background:rgba(74,222,128,0.1);box-shadow:0 0 18px rgba(74,222,128,0.15)}

.mapel-card{padding:10px;border-radius:12px;cursor:pointer;transition:all 0.3s;border:2px solid rgba(99,102,241,0.2);background:rgba(49,46,129,0.4);display:flex;align-items:center;gap:8px}
.mapel-card:hover{transform:translateY(-2px);border-color:rgba(99,102,241,0.4)}
.mapel-card:active{transform:scale(0.98)}
.mapel-card.selected{border-color:#4ade80;background:rgba(74,222,128,0.1)}
.mapel-card.selected .mapel-icon{animation:heartbeat 0.8s ease-in-out}
.mapel-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}

.token-input{letter-spacing:5px;font-size:20px;font-weight:800;text-align:center;font-family:'Fredoka One',cursive;padding:13px;text-transform:uppercase}
.npsn-input{letter-spacing:3px;font-size:18px;font-weight:800;text-align:center;font-family:'Fredoka One',cursive;padding:13px}

.progress-container{height:8px;background:rgba(99,102,241,0.2);border-radius:4px;overflow:hidden}
.progress-bar{height:100%;background:linear-gradient(90deg,#6366f1,#8b5cf6,#a855f7);border-radius:4px;transition:width 0.5s;position:relative}
.progress-bar::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.3),transparent);animation:shimmer 2s infinite}

.question-card{background:rgba(49,46,129,0.5);border-radius:16px;border:2px solid rgba(99,102,241,0.2);padding:14px;margin-bottom:12px;position:relative;overflow:hidden}
.question-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:linear-gradient(180deg,#6366f1,#a855f7);border-radius:4px 0 0 4px}

.question-number{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;background:linear-gradient(135deg,#6366f1,#8b5cf6);border-radius:7px;font-weight:800;font-size:12px;margin-right:6px}

.option-item{display:flex;align-items:flex-start;gap:8px;padding:10px 12px;border-radius:10px;cursor:pointer;transition:all 0.2s;border:2px solid rgba(99,102,241,0.15);background:rgba(30,27,75,0.4)}
.option-item:hover{background:rgba(99,102,241,0.1);border-color:rgba(99,102,241,0.3)}
.option-item:active{transform:scale(0.99)}
.option-item.selected{background:rgba(74,222,128,0.1);border-color:#4ade80}
.option-item.selected .option-letter{background:linear-gradient(135deg,#4ade80,#22c55e);color:white}
.option-letter{width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:10px;background:rgba(99,102,241,0.3);flex-shrink:0;transition:all 0.3s}

.result-card{background:rgba(49,46,129,0.7);border-radius:20px;border:2px solid rgba(99,102,241,0.3);padding:20px;text-align:center}
.score-display{font-family:'Fredoka One',cursive;font-size:64px;line-height:1;background:linear-gradient(135deg,#fbbf24,#f59e0b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.score-display.success{background:linear-gradient(135deg,#4ade80,#22c55e);-webkit-background-clip:text;background-clip:text}
.score-display.fail{background:linear-gradient(135deg,#f87171,#ef4444);-webkit-background-clip:text;background-clip:text}

.confetti-container{position:fixed;inset:0;pointer-events:none;z-index:100}
.confetti{position:absolute;width:10px;height:10px;animation:confetti 3s ease-out forwards}
.confetti:nth-child(odd){border-radius:50%}
.confetti:nth-child(3n){width:8px;height:16px;border-radius:4px}

.toast{position:fixed;top:12px;left:12px;right:12px;z-index:1000;padding:12px 16px;border-radius:12px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;animation:slideUp 0.3s ease;max-width:380px;margin:0 auto}
.toast-success{background:linear-gradient(135deg,#059669,#047857);border:2px solid #4ade80}
.toast-error{background:linear-gradient(135deg,#dc2626,#b91c1c);border:2px solid #f87171}
.toast-info{background:linear-gradient(135deg,#0891b2,#0e7490);border:2px solid #22d3ee}

.badge{display:inline-flex;align-items:center;gap:3px;padding:3px 10px;border-radius:16px;font-size:10px;font-weight:700;white-space:nowrap}
.badge-primary{background:rgba(99,102,241,0.3);color:#a5b4fc}
.badge-success{background:rgba(74,222,128,0.3);color:#4ade80}
.badge-warning{background:rgba(251,191,36,0.3);color:#fbbf24}
.badge-danger{background:rgba(248,113,113,0.3);color:#f87171}
.badge-info{background:rgba(34,211,238,0.3);color:#22d3ee}

.info-box{padding:12px;border-radius:12px;display:flex;align-items:center;gap:10px}
.info-box.success{background:rgba(74,222,128,0.1);border:2px solid rgba(74,222,128,0.3)}
.info-box.warning{background:rgba(251,191,36,0.1);border:2px solid rgba(251,191,36,0.3)}
.info-box.info{background:rgba(99,102,241,0.1);border:2px solid rgba(99,102,241,0.3)}
.info-box.danger{background:rgba(248,113,113,0.1);border:2px solid rgba(248,113,113,0.3)}
.info-box-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}

.stat-card{background:rgba(49,46,129,0.5);border-radius:12px;padding:12px;text-align:center;border:2px solid rgba(99,102,241,0.2)}
.stat-value{font-family:'Fredoka One',cursive;font-size:24px}
.stat-label{font-size:9px;color:#a5b4fc;margin-top:2px}

.dropdown{background:rgba(30,27,75,0.98);border:2px solid rgba(99,102,241,0.3);border-radius:12px;max-height:160px;overflow-y:auto;position:absolute;left:0;right:0;top:100%;margin-top:6px;z-index:20}
.dropdown-item{padding:10px 12px;border-bottom:1px solid rgba(99,102,241,0.1);cursor:pointer;transition:all 0.2s;display:flex;align-items:center;gap:8px}
.dropdown-item:last-child{border-bottom:none}
.dropdown-item:hover{background:rgba(99,102,241,0.2)}

.teacher-card{display:flex;align-items:center;gap:10px;padding:12px;background:rgba(49,46,129,0.5);border-radius:12px;border:2px solid rgba(99,102,241,0.2)}
.teacher-avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}

.topbar{background:rgba(30,27,75,0.9);backdrop-filter:blur(15px);border-bottom:1px solid rgba(99,102,241,0.2);position:sticky;top:0;z-index:50;padding:10px 14px}

.timer-bar{background:rgba(30,27,75,0.95);backdrop-filter:blur(15px);border-bottom:2px solid rgba(99,102,241,0.3);padding:8px 14px;display:flex;align-items:center;justify-content:center;gap:10px;position:sticky;top:0;z-index:60}
.timer-display{font-family:'Fredoka One',cursive;font-size:24px;letter-spacing:2px}
.timer-display.safe{color:#4ade80}
.timer-display.warn{color:#fbbf24}
.timer-display.danger{color:#f87171;animation:urgentPulse 1s infinite}
.timer-label{font-size:10px;color:#a5b4fc;font-weight:600}
.timer-progress{height:4px;background:rgba(99,102,241,0.2);border-radius:2px;flex:1;overflow:hidden}
.timer-progress-fill{height:100%;border-radius:2px;transition:width 1s linear}

.lock-overlay{position:fixed;inset:0;z-index:9999;background:rgba(30,27,75,0.97);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;padding:24px}
.lock-overlay.hidden{display:none}

.form-label{font-size:12px;color:#a5b4fc;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.form-label i{font-size:11px;color:#6366f1}

.input-status{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:16px;transition:all 0.3s}
.input-status.loading{color:#fbbf24;animation:pulse 1s infinite}
.input-status.valid{color:#4ade80}
.input-status.invalid{color:#f87171}

@media(max-width:380px){
  .step-dot{width:24px;height:24px;font-size:9px}
  .step-connector{width:10px}
  .step-lbl{font-size:7px}
  .step-lbl-spacer{width:10px}
  .score-display{font-size:52px}
  .mascot{width:60px;height:60px}
  .mascot-body{width:50px;height:50px}
  .mascot-face{width:38px}
}
</style>
</head>
<body>
<div class="floating-shapes"><div class="shape shape-1"></div><div class="shape shape-2"></div><div class="shape shape-3"></div><div class="shape shape-4"></div></div>
<div class="stars" id="starsContainer"></div>
<div class="confetti-container" id="confettiContainer"></div>
<div id="toastContainer"></div>

<div id="lockOverlay" class="lock-overlay hidden">
  <div style="width:100px;height:100px;border-radius:50%;background:rgba(248,113,113,0.15);display:flex;align-items:center;justify-content:center;animation:pulse 2s infinite"><i class="fas fa-lock" style="font-size:40px;color:#f87171"></i></div>
  <h2 style="font-family:'Fredoka One',cursive;font-size:22px;color:#f87171;text-align:center">UJIAN BERLANGSUNG</h2>
  <p style="color:#a5b4fc;font-size:13px;text-align:center;max-width:280px">Jangan keluar dari halaman ini. Jika Anda keluar, ujian akan otomatis dikirim.</p>
  <button onclick="cancelLock()" style="margin-top:8px;padding:11px 28px;border-radius:12px;background:rgba(248,113,113,0.2);border:2px solid #f87171;color:#f87171;font-weight:700;font-size:13px;cursor:pointer;font-family:'Nunito',sans-serif"><i class="fas fa-arrow-left" style="margin-right:5px"></i>Kembali ke Ujian</button>
</div>

<!-- ===== LOGIN ===== -->
<div id="loginPage" class="min-h-screen flex items-center justify-center p-3 relative z-10">
  <div class="glass p-4 w-full max-w-sm slide-up" style="max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch">
    <div class="mascot happy" id="loginMascot"><div class="mascot-body"><div class="mascot-face"><div class="mascot-eye left"></div><div class="mascot-eye right"></div><div class="mascot-mouth"></div><div class="mascot-cheek left"></div><div class="mascot-cheek right"></div></div></div></div>
    <div class="text-center mb-3">
      <h1 class="font-display text-lg text-light mb-0.5">Halo Teman</h1>
      <p class="text-xs" style="color:#a5b4fc">Siap mengerjakan ujian hari ini?</p>
    </div>
    <div class="step-bar" id="stepBar"></div>
    <div class="step-label-row" id="stepLabelRow"></div>

    <!-- 1: NPSN -->
    <div id="step1Content">
      <div class="form-label"><i class="fas fa-school"></i>Ketik NPSN Sekolahmu</div>
      <div class="mb-2 relative"><div class="relative">
        <i class="fas fa-hashtag absolute left-3 top-1/2 -translate-y-1/2 text-primary" style="font-size:14px"></i>
        <input type="text" id="npsnInput" class="input-field npsn-input" style="padding-left:36px;padding-right:40px" placeholder="Contoh: 20200001" maxlength="10" inputmode="numeric" oninput="onNpsnInput()" onkeydown="if(event.key==='Enter')goToStep2()">
        <span class="input-status" id="npsnStatus"></span>
      </div></div>
      <div id="npsnResult" class="hidden mb-3"></div>
      <button onclick="goToStep2()" id="btnStep1" class="btn-primary" disabled><span>Lanjut</span><i class="fas fa-arrow-right"></i></button>
    </div>

    <!-- 2: Jenis Ujian -->
    <div id="step2Content" class="hidden">
      <div class="form-label"><i class="fas fa-file-alt"></i>Pilih Jenis Ujian</div>
      <div id="examTypeContainer" class="space-y-2 mb-3"></div>
      <button onclick="goToStep3()" id="btnStep2" class="btn-primary" disabled><span>Lanjut</span><i class="fas fa-arrow-right"></i></button>
      <button onclick="backToStep(1)" class="btn-secondary mt-2"><i class="fas fa-arrow-left mr-1"></i>Kembali</button>
    </div>

    <!-- 3: Kelas (1-6 statis) -->
    <div id="step3Content" class="hidden">
      <div class="form-label"><i class="fas fa-layer-group"></i>Pilih Kelas</div>
      <div class="grid grid-cols-3 gap-2 mb-3" id="kelasGrid"></div>
      <button onclick="goToStep4()" id="btnStep3" class="btn-primary" disabled><span>Lanjut</span><i class="fas fa-arrow-right"></i></button>
      <button onclick="backToStep(2)" class="btn-secondary mt-2"><i class="fas fa-arrow-left mr-1"></i>Kembali</button>
    </div>

    <!-- 4: Rombel (A/B/C statis) -->
    <div id="step4Content" class="hidden">
      <div class="form-label"><i class="fas fa-users"></i>Pilih Rombongan Belajar</div>

<script>
var firebaseConfig={apiKey:"AIzaSyC0Hs7SUgPAeQ_JaotHUJL5m6nIhCRif-8",authDomain:"pembuatan-soal.firebaseapp.com",projectId:"pembuatan-soal",storageBucket:"pembuatan-soal.firebasestorage.app",messagingSenderId:"56200686194",appId:"1:56200686194:web:eb2de00c9d152d87bcf0eb"};

function getMapel(id){if(id==='paj')return PAJ_M;for(var i=0;i<MAPEL_LIST.length;i++){if(MAPEL_LIST[i].id===id)return MAPEL_LIST[i];}return{id:id,nama:id,singkat:id,icon:'fa-book',color:'#6366f1'};}

function formatDurasiText(m){if(!m)return '';var h=Math.floor(m/60),mm=m%60;if(h>0&&mm>0)return h+' jam '+mm+' menit';if(h>0)return h+' jam';return mm+' menit';}

function activateLock(){examActive=true;document.getElementById('lockOverlay').classList.remove('hidden');}

history.pushState(null,null,location.href);history.pushState(null,null,location.href);
window.addEventListener('popstate',function(e){if(examActive){history.pushState(null,null,location.href);activateLock();}});
document.addEventListener('keydown',function(e){if(!examActive)return;if(e.key==='F5'||e.key==='F12'){e.preventDefault();e.stopPropagation();activateLock();return;}if(e.ctrlKey&&e.shiftKey&&(e.key==='I'||e.key==='i'||e.key==='J'||e.key==='j')){e.preventDefault();e.stopPropagation();activateLock();return;}if(e.ctrlKey&&(e.key==='r'||e.key==='R'||e.key==='w'||e.key==='W'||e.key==='u'||e.key==='U'||e.key==='s'||e.key==='S'||e.key==='p'||e.key==='P')){e.preventDefault();e.stopPropagation();activateLock();return;}if(e.altKey&&(e.key==='F4'||e.key==='Left')){e.preventDefault();e.stopPropagation();activateLock();}});
document.addEventListener('contextmenu',function(e){if(examActive){e.preventDefault();activateLock();}});

document.addEventListener('cut',function(e){if(examActive)e.preventDefault();});

function generateStars(){var c=document.getElementById('starsContainer');for(var i=0;i<20;i++){var s=document.createElement('div');s.className='star';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.animationDelay=Math.random()*2+'s';c.appendChild(s);}}
function showConfetti(){var c=document.getElementById('confettiContainer');var cols=['#6366f1','#f472b6','#22d3ee','#4ade80','#fbbf24','#f87171','#a78bfa'];for(var i=0;i<40;i++){var cf=document.createElement('div');cf.className='confetti';cf.style.left=Math.random()*100+'%';cf.style.bottom='-10px';cf.style.background=cols[Math.floor(Math.random()*cols.length)];cf.style.animationDelay=Math.random()*2+'s';c.appendChild(cf);(function(x){setTimeout(function(){x.remove();},3500);})(cf);}}

function buildStepIndicator(){
  var bar=document.getElementById('stepBar'),row=document.getElementById('stepLabelRow'),bh='',rh='';
  for(var i=0;i<STEP_DEFS.length;i++){if(i>0)bh+='<div class="step-connector" id="sc_'+i+'"></div>';bh+='<div class="step-dot inactive" id="sd_'+i+'">'+(i+1)+'</div>';if(i>0)rh+='<div class="step-lbl-spacer"></div>';rh+='<div class="step-lbl" id="sl_'+i+'">'+STEP_DEFS[i].label+'</div>';}
  bar.innerHTML=bh;row.innerHTML=rh;
}
function updateStepUI(step){
  currentStep=step;
  for(var i=0;i<STEP_DEFS.length;i++){var dot=document.getElementById('sd_'+i),lbl=document.getElementById('sl_'+i);dot.className='step-dot '+(i<step-1?'done':i===step-1?'active':'inactive');lbl.className='step-lbl '+(i<step-1?'done':i===step-1?'active':'');if(i<step-1)dot.innerHTML='<i class="fas fa-check" style="font-size:8px"></i>';else dot.textContent=(i+1);if(i>0){var cn=document.getElementById('sc_'+i);cn.className='step-connector'+(i<step-1?' done':'');}}
  for(var i=1;i<=7;i++){var c=document.getElementById('step'+i+'Content');if(c)c.classList.toggle('hidden',i!==step);}
}

function initApp(){
  generateStars();buildStepIndicator();
  db.collection('guru_panel').onSnapshot(function(s){guruList=s.docs.map(function(d){return Object.assign({id:d.id},d.data());});});
  db.collection('siswa_panel').onSnapshot(function(s){siswaList=s.docs.map(function(d){return Object.assign({id:d.id},d.data());});});
  db.collection('questions').orderBy('createdAt','asc').onSnapshot(function(s){questions=s.docs.map(function(d){return Object.assign({id:d.id},d.data());});});
  db.collection('questions_paj').orderBy('createdAt','asc').onSnapshot(function(s){pajQuestions=s.docs.map(function(d){return Object.assign({id:d.id},d.data());});});
  db.collection('nilai_panel').onSnapshot(function(s){nilaiList=s.docs.map(function(d){return Object.assign({id:d.id},d.data());});});
}

/* ===== STEP 1: NPSN ===== */
function findSchoolByNpsn(npsn){for(var i=0;i<guruList.length;i++){if(guruList[i].npsn===npsn&&guruList[i].sekolah)return guruList[i];}return null;}
function onNpsnInput(){
  var inp=document.getElementById('npsnInput'),st=document.getElementById('npsnStatus'),res=document.getElementById('npsnResult'),btn=document.getElementById('btnStep1');
  inp.value=inp.value.replace(/[^0-9]/g,'');var val=inp.value.trim();
  selectedNpsn=null;selectedSekolah=null;btn.disabled=true;res.classList.add('hidden');
  inp.className='input-field npsn-input';inp.style.paddingLeft='36px';inp.style.paddingRight='40px';st.className='input-status';st.innerHTML='';
  if(!val||val.length<4){st.innerHTML='<i class="fas fa-search" style="font-size:14px;color:#4c4678"></i>';return;}
  st.className='input-status loading';st.innerHTML='<i class="fas fa-spinner fa-spin"></i>';
  if(npsnDebounce)clearTimeout(npsnDebounce);
  npsnDebounce=setTimeout(function(){
    var f=findSchoolByNpsn(val);
    if(f){selectedNpsn=f.npsn;selectedSekolah=f.sekolah;inp.className='input-field npsn-input valid';inp.style.paddingLeft='36px';inp.style.paddingRight='40px';st.className='input-status valid';st.innerHTML='<i class="fas fa-check-circle"></i>';res.classList.remove('hidden');res.innerHTML='<div class="info-box success"><div class="info-box-icon bg-success/30"><i class="fas fa-school text-success"></i></div><div class="flex-1 min-w-0"><p class="text-xs font-semibold text-light truncate">'+escHtml(f.sekolah)+'</p><p class="text-xs" style="color:#a5b4fc">NPSN: '+f.npsn+' — Terverifikasi</p></div></div>';btn.disabled=false;}
    else{inp.className='input-field npsn-input invalid';inp.style.paddingLeft='36px';inp.style.paddingRight='40px';st.className='input-status invalid';st.innerHTML='<i class="fas fa-times-circle"></i>';if(val.length>=6){res.classList.remove('hidden');res.innerHTML='<div class="info-box danger"><div class="info-box-icon bg-danger/30"><i class="fas fa-exclamation-triangle text-danger"></i></div><p class="text-xs text-danger">NPSN <strong>'+val+'</strong> tidak ditemukan</p></div>';}btn.disabled=true;}
  },400);
}
function goToStep2(){if(!selectedNpsn){showToast('NPSN tidak valid','error');return;}updateStepUI(2);renderStep2();}

/* ===== STEP 2: JENIS UJIAN ===== */
function getFilteredGuru(){return guruList.filter(function(g){return g.npsn===selectedNpsn;});}
function renderStep2(){
  var fG=getFilteredGuru(),hasSAT=false,hasPAJ=false;
  for(var i=0;i<fG.length;i++){var tm=fG[i].tokenMapel||{},ks=Object.keys(tm);for(var j=0;j<ks.length;j++){if(ks[j]!=='paj'&&tm[ks[j]])hasSAT=true;}if(tm.paj)hasPAJ=true;}
  var el=document.getElementById('examTypeContainer'),h='';
  if(hasSAT){var sc=0;for(var i=0;i<fG.length;i++){var tm=fG[i].tokenMapel||{},ks=Object.keys(tm);for(var j=0;j<ks.length;j++){if(ks[j]!=='paj'&&tm[ks[j]])sc++;}}
    h+='<div class="select-card" id="cardSAT" onclick="selectExamType(\'sat\')"><div style="width:44px;height:44px;margin:0 auto 6px;background:rgba(99,102,241,0.2);border-radius:12px;display:flex;align-items:center;justify-content:center"><i class="fas fa-file-alt text-primary" style="font-size:18px"></i></div><p class="font-bold text-light text-sm">Sumatif Akhir Tahun</p><p class="text-xs" style="color:#a5b4fc">SAT — '+sc+' mata pelajaran</p></div>';}
  if(hasPAJ){h+='<div class="select-card" id="cardPAJ" onclick="selectExamType(\'paj\')"><div style="width:44px;height:44px;margin:0 auto 6px;background:rgba(248,113,113,0.2);border-radius:12px;display:flex;align-items:center;justify-content:center"><i class="fas fa-graduation-cap text-danger" style="font-size:18px"></i></div><p class="font-bold text-light text-sm">Penilaian Akhir Jenjang</p><p class="text-xs" style="color:#a5b4fc">PAJ — Kelas 6</p></div>';}
  if(!hasSAT&&!hasPAJ)h+='<div class="text-center py-6"><p class="text-xs" style="color:#a5b4fc"><i class="fas fa-inbox mr-1"></i>Belum ada ujian tersedia</p></div>';
  el.innerHTML=h;document.getElementById('btnStep2').disabled=true;selectedExamType=null;selectedMapel=null;

function selectExamType(t){selectedExamType=t;selectedMapel=null;document.querySelectorAll('#examTypeContainer .select-card').forEach(function(c){c.classList.remove('selected');});document.getElementById(t==='paj'?'cardPAJ':'cardSAT').classList.add('selected');document.getElementById('btnStep2').disabled=false;}

function hasTokenForMapel(g,mid){var tm=g.tokenMapel||{};return!!tm[mid];}

  var el=document.getElementById('mapelContainer'),fG=getFilteredGuru();
  if(selectedExamType==='paj'){selectedMapel='paj';el.innerHTML='<div class="info-box info"><div class="info-box-icon" style="background:rgba(248,113,113,0.2)"><i class="fas fa-graduation-cap text-danger"></i></div><div><p class="text-sm font-semibold text-light">Penilaian Akhir Jenjang</p><p class="text-xs" style="color:#a5b4fc">Semua mapel digabung dalam satu sesi</p></div></div>';document.getElementById('btnStep5').disabled=false;return;}
  var kN=selectedKelas.replace('Kelas ',''),krK=kN+'_'+selectedRombel,mm={};
  for(var i=0;i<fG.length;i++){var g=fG[i],tm=g.tokenMapel||{},ks=Object.keys(tm);for(var j=0;j<ks.length;j++){var mid=ks[j];if(mid==='paj'||!tm[mid]||!hasTokenForMapel(g,mid))continue;var kr=g.kelasRombel||{};if(kr[krK]||(g.kelas===selectedKelas&&g.rombel===selectedRombel)){if(!mm[mid])mm[mid]={guruId:g.id,guruNama:g.nama,token:tm[mid],durasi:(g.durasiMapel||{})[mid]||0};}}}
  var mks=Object.keys(mm);if(!mks.length){el.innerHTML='<div class="text-center py-6"><p class="text-xs" style="color:#a5b4fc"><i class="fas fa-inbox mr-1"></i>Belum ada mapel untuk '+selectedKelas+' '+selectedRombel+'</p></div>';document.getElementById('btnStep5').disabled=true;return;}
  var h='';for(var i=0;i<mks.length;i++){var m=getMapel(mks[i]),s=mm[mks[i]],dB=s.durasi>0?'<span class="badge badge-warning" style="font-size:9px"><i class="fas fa-clock mr-1"></i>'+formatDurasiText(s.durasi)+'</span>':'';h+='<div class="mapel-card" id="mapel_'+mks[i]+'" onclick="selectMapel(\''+mks[i]+'\')"><div class="mapel-icon" style="background:'+m.color+'20"><i class="fas '+m.icon+'" style="color:'+m.color+'"></i></div><div class="flex-1 min-w-0"><p class="text-xs font-semibold text-light">'+escHtml(m.singkat)+'</p><p class="text-xs" style="color:#a5b4fc;font-size:9px">'+escHtml(m.nama)+'</p><div class="flex items-center gap-2 mt-1"><span class="text-xs" style="color:#a5b4fc;font-size:9px"><i class="fas fa-chalkboard-teacher mr-1"></i>'+escHtml(s.guruNama)+'</span>'+dB+'</div></div><i class="fas fa-chevron-right" style="color:#4c4678;font-size:11px;flex-shrink:0"></i></div>';}

function goToStep6(){if(!selectedMapel){showToast('Pilih mapel dulu','error');return;}updateStepUI(6);renderStep6();}

/* ===== STEP 6: NAMA ===== */
function getTokenSource(){var fG=getFilteredGuru(),kN=selectedKelas.replace('Kelas ',''),krK=kN+'_'+selectedRombel;for(var i=0;i<fG.length;i++){var g=fG[i];if(!hasTokenForMapel(g,selectedMapel))continue;var kr=g.kelasRombel||{};if(kr[krK])return{guruId:g.id,guruNama:g.nama,token:(g.tokenMapel||{})[selectedMapel],durasi:(g.durasiMapel||{})[selectedMapel]||0};if(g.kelas===selectedKelas&&g.rombel===selectedRombel)return{guruId:g.id,guruNama:g.nama,token:(g.tokenMapel||{})[selectedMapel],durasi:(g.durasiMapel||{})[selectedMapel]||0};}return null;}

  var info=document.getElementById('summaryInfo'),m=getMapel(selectedMapel),s=getTokenSource(),gN=s?s.guruNama:selectedGuru.nama,dB=s&&s.durasi>0?'<span class="badge badge-warning"><i class="fas fa-clock mr-1"></i>'+formatDurasiText(s.durasi)+'</span>':'';

function backToStep(step){updateStepUI(step);if(step===1){var inp=document.getElementById('npsnInput'),st=document.getElementById('npsnStatus');document.getElementById('npsnResult').classList.add('hidden');if(!selectedNpsn){inp.className='input-field npsn-input';inp.style.paddingLeft='36px';inp.style.paddingRight='40px';st.className='input-status';st.innerHTML='<i class="fas fa-search" style="font-size:14px;color:#4c4678"></i>';}}else if(step===2)renderStep2();else if(step===3)renderStep3();else if(step===4)renderStep4();else if(step===5)renderStep5();else if(step===6)renderStep6();else if(step===7)renderStep7();}

/* ===== MULAI UJIAN ===== */
function startExam(){
  if(!tokenValidated){showToast('Token belum valid','error');return;}
  var isP=selectedMapel==='paj',src=isP?pajQuestions:questions,aQ=src.filter(function(q){if(!isP)return q.kelas===selectedKelas&&q.mapel===selectedMapel;return true;});

  for(var i=0;i<nilaiList.length;i++){var n=nilaiList[i];if(n.mapel===selectedMapel&&n.kelas===selectedKelas&&n.rombel===selectedRombel&&n.nama===studentName&&n.guruId===gId){showToast('Kamu sudah pernah mengerjakan ujian ini!','error');return;}}

  sessionData=null;studentName="";document.getElementById('examPage').classList.add('hidden');document.getElementById('loginPage').classList.remove('hidden');document.getElementById('lockOverlay').classList.add('hidden');

  document.getElementById('npsnStatus').className='input-status';document.getElementById('npsnStatus').innerHTML='<i class="fas fa-search" style="font-size:14px;color:#4c4678"></i>';document.getElementById('npsnResult').classList.add('hidden');updateStepUI(1);

/* ===== HALAMAN UJIAN ===== */
function initExam(){document.getElementById('topNama').textContent=sessionData.nama;document.getElementById('topSekolah').textContent=sessionData.guruWali.sekolah;var mp=getMapel(sessionData.mapel);document.getElementById('topMapel').innerHTML='<i class="fas '+mp.icon+' mr-1"></i>'+mp.singkat;setupTimer();renderQuestions();}
function setupTimer(){var c=document.getElementById('timerBarContainer'),d=sessionData.durasiMenit||0;if(d<=0){c.classList.add('hidden');c.innerHTML='';return;}examDurationSeconds=d*60;examRemainingSeconds=examDurationSeconds;c.classList.remove('hidden');c.innerHTML=bTH(examRemainingSeconds,examDurationSeconds);examTimerInterval=setInterval(function(){examRemainingSeconds--;if(examRemainingSeconds<=0){examRemainingSeconds=0;clearInterval(examTimerInterval);examTimerInterval=null;c.innerHTML=bTH(0,examDurationSeconds);showToast('Waktu habis! Otomatis dikirim.','error');setTimeout(function(){submitExam();},1000);return;}c.innerHTML=bTH(examRemainingSeconds,examDurationSeconds);},1000);}
function bTH(r,t){var p=t>0?(r/t*100):0,m=Math.floor(r/60),s=r%60,ts=(m<10?'0':'')+m+':'+(s<10?'0':'')+s,cc='safe',bc='#4ade80';if(p<=10){cc='danger';bc='#f87171';}else if(p<=25){cc='warn';bc='#fbbf24';}return'<div class="timer-bar"><i class="fas fa-clock" style="color:'+bc+';font-size:14px"></i><div class="timer-label">SISA WAKTU</div><div class="timer-display '+cc+'">'+ts+'</div><div class="timer-progress"><div class="timer-progress-fill" style="width:'+p+'%;background:'+bc+'"></div></div></div>';}

function renderQuestions(){
  var m=sessionData.mapel,k=sessionData.kelas,isP=m==='paj',src=isP?pajQuestions:questions;
  var aQ=src.filter(function(q){if(!isP)return q.kelas===k&&q.mapel===m;return true;});
  var pgQ=aQ.filter(function(q){return q.type==='pg';}),urQ=aQ.filter(function(q){return q.type==='uraian';});
  if(!aQ.length){document.getElementById('examContent').innerHTML='<div class="text-center py-16 fade-in"><div class="w-16 h-16 mx-auto mb-3 rounded-full bg-warning/20 flex items-center justify-center"><i class="fas fa-clipboard-list text-warning text-2xl"></i></div><h3 class="font-display text-lg text-light mb-1">Belum Ada Soal</h3><p class="text-xs" style="color:#a5b4fc">Guru belum menambahkan soal</p></div>';return;}
  var mp=getMapel(m),lt=getOptLetters(k),h='<div class="slide-up">';
  h+='<div class="info-box info mb-3"><div class="info-box-icon" style="background:'+mp.color+'30"><i class="fas '+mp.icon+'" style="color:'+mp.color+'"></i></div><div class="flex-1 min-w-0"><p class="text-xs font-semibold text-light">'+escHtml(mp.nama)+'</p><p class="text-xs" style="color:#a5b4fc">'+aQ.length+' soal — '+pgQ.length+' PG + '+urQ.length+' Uraian</p></div></div>';
  h+='<div class="info-box danger mb-3"><div class="info-box-icon bg-danger/30"><i class="fas fa-exclamation-triangle text-danger"></i></div><p class="text-xs text-light"><strong>Penting:</strong> Ujian hanya bisa dikerjakan sekali!</p></div>';
  h+='<div class="mb-3"><div class="flex justify-between text-xs" style="color:#a5b4fc;margin-bottom:4px"><span>Progress</span><span id="progressText">0/'+pgQ.length+'</span></div><div class="progress-container"><div class="progress-bar" id="progressBar" style="width:0%"></div></div></div>';
  h+='<div id="questionsContainer">';
  if(pgQ.length){h+='<div class="mb-3"><div class="flex items-center gap-2 mb-2"><div class="h-0.5 flex-1 bg-primary rounded"></div><span class="text-xs font-bold text-primary px-2">PILIHAN GANDA</span><div class="h-0.5 flex-1 bg-primary rounded"></div></div>';for(var i=0;i<pgQ.length;i++){var q=pgQ[i];h+='<div class="question-card"><p class="text-xs text-light font-semibold leading-relaxed mb-2"><span class="question-number">'+(i+1)+'</span>'+escHtml(q.text)+'</p>';if(q.image)h+='<div class="mb-2 ml-8"><img src="'+q.image+'" style="max-height:120px;max-width:100%;object-fit:contain;border-radius:8px;border:2px solid rgba(99,102,241,0.3);pointer-events:none" onerror="this.style.display=\'none\'"></div>';h+='<div class="space-y-1.5 ml-8">';var opts=q.options||[];for(var oi=0;oi<opts.length;oi++){var L=lt[oi]?lt[oi].toUpperCase():'';h+='<div class="option-item" id="opt_'+i+'_'+oi+'" onclick="selectOption('+i+','+oi+')"><span class="option-letter">'+L+'</span><span class="text-xs text-light flex-1">'+escHtml(opts[oi])+'</span>';if(q.optionImages&&q.optionImages[oi])h+='<img src="'+q.optionImages[oi]+'" style="max-width:36px;max-height:28px;object-fit:contain;border-radius:4px;pointer-events:none" onerror="this.style.display=\'none\'">';h+='</div>';}h+='</div></div>';}h+='</div>';}
  if(urQ.length){h+='<div class="mb-3"><div class="flex items-center gap-2 mb-2"><div class="h-0.5 flex-1 bg-accent rounded"></div><span class="text-xs font-bold text-accent px-2">URAIAN</span><div class="h-0.5 flex-1 bg-accent rounded"></div></div>';for(var i=0;i<urQ.length;i++){var q=urQ[i];h+='<div class="question-card" style="border-left:4px solid #22d3ee"><p class="text-xs text-light font-semibold leading-relaxed mb-2"><span class="question-number" style="background:linear-gradient(135deg,#22d3ee,#06b6d4)">'+(pgQ.length+i+1)+'</span>'+escHtml(q.text)+'</p>';if(q.image)h+='<div class="mb-2 ml-8"><img src="'+q.image+'" style="max-height:120px;max-width:100%;object-fit:contain;border-radius:8px;border:2px solid rgba(34,211,238,0.3);pointer-events:none" onerror="this.style.display=\'none\'"></div>';h+='<div class="ml-8 p-3 border-2 border-dashed rounded-xl text-center" style="border-color:rgba(165,180,252,0.3);background:rgba(30,27,75,0.3)"><i class="fas fa-pen mr-1" style="color:#a5b4fc;font-size:10px"></i><span class="text-xs" style="color:#a5b4fc">Jawab di kertas ujian</span></div></div>';}h+='</div>';}
  h+='</div><div class="fixed bottom-0 left-0 right-0 p-3 no-print" style="background:linear-gradient(to top,#1e1b4b,#1e1b4bee,#1e1b4b00);padding-bottom:max(12px,env(safe-area-inset-bottom))"><button onclick="submitExam()" id="submitBtn" class="btn-primary" style="max-width:380px;margin:0 auto"><i class="fas fa-paper-plane"></i><span>Selesai dan Kirim Nilai</span></button></div><div style="height:72px" class="no-print"></div></div>';

function selectOption(qi,oi){document.querySelectorAll('[id^="opt_'+qi+'_"]').forEach(function(e){e.classList.remove('selected');});var o=document.getElementById('opt_'+qi+'_'+oi);if(o){o.classList.add('selected','pop');setTimeout(function(){o.classList.remove('pop');},400);}updateProgress();}
function updateProgress(){var pgC=document.querySelectorAll('.question-card:not([style*="border-left:4px solid #22d3ee"])'),t=pgC.length,a=0;pgC.forEach(function(c){if(c.querySelector('.option-item.selected'))a++;});var b=document.getElementById('progressBar'),tx=document.getElementById('progressText');if(b)b.style.width=(t>0?Math.round(a/t*100):0)+'%';if(tx)tx.textContent=a+'/'+t;}

/* ===== SUBMIT ===== */
function submitExam(){
  var btn=document.getElementById('submitBtn');if(btn){btn.disabled=true;btn.innerHTML='<div class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></div><span>Mengirim...</span>';}
  var m=sessionData.mapel,k=sessionData.kelas,isP=m==='paj',src=isP?pajQuestions:questions;
  var aQ=src.filter(function(q){if(!isP)return q.kelas===k&&q.mapel===m;return true;});
  var pgQ=aQ.filter(function(q){return q.type==='pg';}),lt=getOptLetters(k),pM=0;for(var i=0;i<pgQ.length;i++)pM+=(pgQ[i].score||1);
  var ua=[];for(var i=0;i<pgQ.length;i++){if(!document.querySelector('[id^="opt_'+i+'_"].selected'))ua.push(i+1);}
  if(ua.length&&!confirm('Soal nomor '+ua.join(', ')+' belum dijawab. Yakin kirim?')){if(btn){btn.disabled=false;btn.innerHTML='<i class="fas fa-paper-plane"></i><span>Selesai dan Kirim Nilai</span>';}return;}
  var pS=0,pD=[];for(var i=0;i<pgQ.length;i++){var q=pgQ[i],sE=document.querySelector('[id^="opt_'+i+'_"].selected'),jw='';if(sE){var idx=parseInt(sE.id.split('_')[2]);jw=lt[idx]?lt[idx].toUpperCase():'';}var kn=(q.answer||'').toUpperCase(),bn=jw===kn;if(bn)pS+=(q.score||1);pD.push({no:i+1,kunci:kn,jawaban:jw,benar:bn,soal:q.text});}
  var nA=calcScore(pS,0,pM,0),bC=0;for(var i=0;i<pD.length;i++){if(pD[i].benar)bC++;}
  var data={guruId:sessionData.guruId,npsn:sessionData.guruWali.npsn,sekolah:sessionData.guruWali.sekolah,kelas:k,rombel:sessionData.rombel,mapel:m,nama:sessionData.nama,absen:0,pgSkor:pS,urSkor:0,pgMax:pM,urMax:0,nilaiAkhir:nA,pgDetail:pD,createdAt:firebase.firestore.FieldValue.serverTimestamp(),source:'siswa_panel'};
  db.collection('nilai_panel').add(data).then(function(){examActive=false;if(examTimerInterval){clearInterval(examTimerInterval);examTimerInterval=null;}showResult(nA,pS,pM,bC,pgQ.length,pD);showToast('Nilai berhasil dikirim!');if(nA>=70)showConfetti();}).catch(function(e){showToast('Gagal: '+(e.message||''),'error');if(btn){btn.disabled=false;btn.innerHTML='<i class="fas fa-paper-plane"></i><span>Selesai dan Kirim Nilai</span>';}});
}
function calcScore(pg,ur,pm,um){if(!pm&&!um)return 0;if(!pm)return Math.round(ur/um*100);if(!um)return Math.round(pg/pm*100);return Math.round((pg/pm*40)+(ur/um*60));}

/* ===== HASIL ===== */
function showResult(nilai,pS,pM,benar,tot,pD){
  var lp=nilai>=70,pr=nilai>=90?'A':nilai>=80?'B':nilai>=70?'C':nilai>=60?'D':'E',pc=pM>0?Math.round(pS/pM*100):0;
  document.getElementById('questionsContainer').style.display='none';document.getElementById('timerBarContainer').classList.add('hidden');document.getElementById('examTopbar').style.display='none';document.querySelectorAll('.no-print').forEach(function(e){e.style.display='none';});

  h+='<p class="text-xs" style="color:#a5b4fc;margin-bottom:4px">Nilai Kamu</p><p class="score-display '+(lp?'success':'fail')+'">'+nilai+'</p><p class="text-base font-bold mt-1 '+(lp?'text-success':'text-danger')+'">Predikat '+pr+'</p><p class="text-xs '+(lp?'text-success':'text-danger')+' mt-0.5">'+(lp?'<i class="fas fa-trophy mr-1"></i>Hebat! Kamu tuntas!':'<i class="fas fa-heart mr-1"></i>Tetap semangat!')+'</p></div>';
  h+='<div class="grid grid-cols-3 gap-2 mb-4"><div class="stat-card"><p class="stat-value text-success">'+benar+'</p><p class="stat-label">Benar</p></div><div class="stat-card"><p class="stat-value text-primary">'+pS+'</p><p class="stat-label">Skor ('+pc+'%)</p></div><div class="stat-card"><p class="stat-value '+(lp?'text-success':'text-danger')+'">'+(lp?'Tuntas':'Belum')+'</p><p class="stat-label">Status</p></div></div>';
  h+='<div class="info-box success mb-4"><div class="info-box-icon bg-success/30"><i class="fas fa-check-circle text-success"></i></div><p class="text-xs text-success">Nilai sudah terkirim ke guru</p></div>';
  h+='<div class="mb-4"><h4 class="text-xs font-bold text-light mb-2 flex items-center gap-2"><i class="fas fa-book-open text-primary"></i>Pembahasan Jawaban</h4><div class="space-y-2">';
  for(var i=0;i<pD.length;i++){var d=pD[i];h+='<div class="question-card" style="padding:12px;border-color:'+(d.benar?'rgba(74,222,128,0.3)':'rgba(248,113,113,0.3)')+'"><div class="flex items-center gap-2 mb-1"><span class="question-number" style="background:'+(d.benar?'linear-gradient(135deg,#4ade80,#22c55e)':'linear-gradient(135deg,#f87171,#ef4444)')+'">'+d.no+'</span><span class="text-xs font-semibold '+(d.benar?'text-success':'text-danger')+'">'+(d.benar?'<i class="fas fa-check-circle mr-1"></i>Benar':'<i class="fas fa-times-circle mr-1"></i>Salah')+'</span></div><p class="text-xs mb-1.5" style="color:#a5b4fc;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">'+escHtml(d.soal)+'</p><div class="flex gap-3 text-xs" style="color:#a5b4fc">Jawabmu: <span class="inline-flex items-center justify-center w-5 h-5 rounded-md '+(d.benar?'bg-success/30 text-success':'bg-danger/30 text-danger')+'" style="font-size:10px;font-weight:800">'+(d.jawaban||'-')+'</span>Kunci: <span class="inline-flex items-center justify-center w-5 h-5 rounded-md bg-success/30 text-success" style="font-size:10px;font-weight:800">'+escHtml(d.kunci)+'</span></div></div>';}
  h+='</div></div><button onclick="logoutExam()" class="btn-secondary mb-6"><i class="fas fa-home mr-1"></i>Selesai dan Kembali</button></div>';
  document.getElementById('examContent').innerHTML=h;window.scrollTo({top:0,behavior:'smooth'});
}
